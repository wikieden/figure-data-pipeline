[project]
name = "fdp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wikieden", email = "wikieden@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcap>=1.4.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.5",
    "rerun-sdk>=0.36.3",
    "typer>=0.27.2",
]

[project.scripts]
fdp = "fdp.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
