anchor="start" font-weight="bold" fill="currentColor" >头部相机吊舱</text><text x="548" y="104" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >立柱顶端前向视窗；dyna-2 评测视频写「top camera」</text><text x="548" y="117" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >首页/公司页视频帧 ⚠️；dyna-2：一手（top camera）</text><circle cx="530" cy="130" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="134" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><text x="548" y="134" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >胸口相机</text><text x="548" y="148" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >机身正面（横向开口；早期帧为侧装小黑盒）</text><text x="548" y="161" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >视频帧 ⚠️</text><circle cx="530" cy="174" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="178" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >3</text><text x="548" y="178" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >腕装相机 ×2</text><text x="548" y="192" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >每只夹爪上方经支架装一枚（镜头 + LED），朝向指尖</text><text x="548" y="205" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >公司页 9.0 s 帧 ⚠️；infra 页「several cameras…each at its own rate」一手</text><circle cx="530" cy="218" r="10" fill="rgba(255,255,255,0.0)" stroke="#1baf7a" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="222" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1baf7a" >4</text><text x="548" y="222" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >触觉</text><text x="548" y="236" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >首页图示列「tactile」，帧上看不出传感器外观与位置</text><text x="548" y="249" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >dyna.co 首页图示：一手（有），位置 ⚠️</text><circle cx="530" cy="262" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="266" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >5</text><text x="548" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >本体感知 + 关节电流</text><text x="548" y="280" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >各关节；product 页以电流与轨迹跟踪误差建硬件退化指数</text><text x="548" y="293" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >dyna-2 / product：一手</text><circle cx="530" cy="306" r="10" fill="rgba(255,255,255,0.0)" stroke="#eda100" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="310" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#eda100" >6</text><text x="548" y="310" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >机上录制与遥测</text><text x="548" y="324" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >相机流 + 机器人状态 + 控制指令 + 应用事件 + 硬件遥测，MCAP 落盘</text><text x="548" y="337" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >product / infra：一手；硬件位置不适用</text><text x="520" y="360" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >末端变体：自研平行夹爪（默认，弯指）；WUJI-2 20-DoF 五指手；半人形原型 [dyna-2 一手]。</text><text x="520" y="378" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >未披露：相机型号/分辨率/帧率、触觉传感器类型、是否有深度/IMU/麦克风。</text><text x="520" y="396" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >机身两侧虚线短杆 = 紧凑型的第二种安装（双臂直接装在肩托，公司页帧 ⚠️）。</text><text x="20" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >颜色 = 传感器类别：</text><rect x="140" y="576" width="10" height="10" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="154" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >视觉</text><rect x="202" y="576" width="10" height="10" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="216" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >触觉/力</text><rect x="264" y="576" width="10" height="10" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="278" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >本体感知</text><rect x="326" y="576" width="10" height="10" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="340" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >音频</text><rect x="388" y="576" width="10" height="10" rx="2" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><text x="402" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >供电/通信</text><text x="20" y="601" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >标记样式：实心 = 一手文字写明位置；虚线 = 一手提及该传感器但位置未写明/来自图片推断 ⚠️；? = 未披露。</text></svg>