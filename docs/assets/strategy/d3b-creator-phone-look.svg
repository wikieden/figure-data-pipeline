<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-label="D3 Creator 手机采集套件外观线稿：胸戴支架把手机横置于胸前并可调俯角，头带为备选；右侧为 App 录制界面示意，含硬件级录制指示、即时质量反馈与同意档位" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D3b Creator 手机采集套件 · 外观线稿（P0）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >胸戴支架 + App 界面；唯一零设备成本入口。未脱敏帧永不离开手机。</text><text x="40" y="80" font-size="10.5" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >胸戴（正视）</text><path d="M120,140 Q170,110 220,140 L250,150 Q300,170 300,230 L300,420 L60,420 L60,230 Q60,170 110,150 Z" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.9" stroke-dasharray="3 3"/><circle cx="180" cy="105" r="26" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.9"/><path d="M110,150 L165,240 M250,150 L195,240 M70,300 L290,300" stroke="currentColor" stroke-width="5" opacity="0.5" fill="none"/><rect x="120" y="230" width="120" height="62" rx="8" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1.4" opacity="1"></rect><rect x="126" y="236" width="108" height="50" rx="4" fill="rgba(42,120,214,0.10)" stroke="currentColor" stroke-width="0.6" opacity="1"></rect><circle cx="138" cy="246" r="5" fill="rgba(42,120,214,0.35)" stroke="currentColor" stroke-width="1.2"/><circle cx="228" cy="242" r="3" fill="#e5484d" stroke="currentColor" stroke-width="0.6"/><rect x="160" y="292" width="40" height="14" rx="3" fill="rgba(128,136,144,0.22)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="180" y="340" font-size="