ke-width="1" opacity="1"></rect><text x="1016" y="163" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >92</text><text x="890" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" >曝光</text><rect x="890" y="186" width="120" height="8" rx="4" fill="rgba(128,136,144,0.25)" stroke="none" stroke-width="1" opacity="1"></rect><rect x="890" y="186" width="96.0" height="8" rx="4" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="1016" y="193" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >80</text><text x="890" y="210" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" >抖动</text><rect x="890" y="216" width="120" height="8" rx="4" fill="rgba(128,136,144,0.25)" stroke="none" stroke-width="1" opacity="1"></rect><rect x="890" y="216" width="42.0" height="8" rx="4" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="1016" y="223" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >35</text><text x="890" y="250" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >同意：② 研究+商用 · region CN</text><text x="890" y="266" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >计酬：本段 ≈ ¥6（按质量分）</text><rect x="890" y="276" width="120" height="22" rx="6" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="950" y="291" font-size="9.5" text-anchor="middle" font-weight="bold" fill="#fff" >结束并上传（先脱敏）</text><circle cx="659" cy="345" r="9" fill="#2a78d6"/><text x="659" y="348.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >1</text><text x="676" y="343" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >自有手机</text><text x="676" y="356" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >横置，主相机 1080p@60，ARKit/ARCore 位姿 60 Hz</text><circle cx="659" cy="375" r="9" fill="#2a78d6"/><text x="659" y="378.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >2</text><text x="676" y="373" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >胸带 / 肩带</text><text x="676" y="386" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >可调，&lt;$15；头带备选</text><circle cx="659" cy="405" r="9" fill="#2a78d6"/><text x="659" y="408.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >3</text><text x="676" y="403" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >快拆支架</text><text x="676" y="416" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >俯角 15–30° 档位；支架型号进设备档案</text><circle cx="659" cy="435" r="9" fill="#2a78d6"/><text x="659" y="438.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >4</text><text x="676" y="433" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >硬件级指示</text><text x="676" y="446" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >录制时 LED/屏幕常亮 + 提示音；旁观者可见</text><text x="40" y="470" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：手机是采集端也是脱敏端；支架只解决俯角与稳定两件事；App 的 30 秒质量反馈是它比裸手机拍摄多出的全部硬件外价值。</text></svg>