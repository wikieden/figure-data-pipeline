<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 410" width="1080" height="410" role="img" aria-label="D1 触觉同构 UMI 的数据流：七路传感器经硬件触发同步进入机上 SoC 编码打包并落盘 MCAP，产出腕部视频、末端位姿、指宽、触觉与力矩流" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D1 触觉同构 UMI（device 轨主力）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >服务：device 轨 · 控制点 2 对齐集 · R-04 触觉探针 · 演示库 | 里程碑：P0 平行夹爪 ×2 → H1 触觉 EVT ×4 → U-04 后同构版 | BOM ≤$400（触觉版 +$300–600）</text><text x="20" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >传感器（原生频率）</text><rect x="20" y="70" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="70" width="5" height="32" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="83" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >腕部鱼眼 RGB（全局快门）</text><text x="32" y="97" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >1080p@60</text><line x1="240" y1="86" x2="270" y2="86" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="110" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="110" width="5" height="32" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="123" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >掌内相机（可选）</text><text x="32" y="137" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >640p@30</text><line x1="240" y1="126" x2="270" y2="126" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="150" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="150" width="5" height="32" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="163" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >指尖触觉阵列 ×2</text><text x="32" y="177" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >20–30 Hz</text><line x1="240" y1="166" x2="270" y2="166" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="190" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="190" width="5" height="32" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="203" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >腕部六维力/力矩（可选）</text><text x="32" y="217" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >100 Hz</text><line x1="240" y1="206" x2="270" y2="206" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="230" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="230" width="5" height="32" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="243" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >指宽编码器</text><text x="32" y="257" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >200 Hz</text><line x1="240" y1="246" x2="270" y2="246" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="270" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="270" width="5" height="32" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="283" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >腕部 IMU</text><text x="32" y="297" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >200 Hz</text><line x1="240" y1="286" x2="270" y2="286" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="310" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="310" width="5" height="32" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="323" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >VIO 位姿（机上）</text><text x="32" y="337" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >60 Hz</text><line x1="240" y1="326" x2="270" y2="326" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="270" y="70" width="170" height="272" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="355.0" y="181.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >同步 / 时钟</text><text x="355.0" y="195.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >相机触发脉冲 ≤1 ms</text><text x="355.0" y="209.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >IMU↔视觉 ≤2 ms</text><text x="355.0" y="223.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >触觉↔动作 ≤2 ms</text><text x="355.0" y="237.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >跨设备 /event/sync（LED）</text><line x1="440" y1="206.0" x2="470" y2="206.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="470" y="70" width="225" height="272" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" /><text x="582.5" y="181.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >机上处理</text><text x="582.5" y="195.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >h265 硬编 + IMU/触觉/编码器打包</text><text x="582.5" y="209.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >VIO（Basalt，BSD）</text><text x="582.5" y="223.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >实时预检：跟踪置信度 · 标记可见率</text><text x="582.5" y="237.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >方案 B：未脱敏 raw 加密</text><line x1="695" y1="206.0" x2="725" y2="206.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="725" y="70" width="135" height="272" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="792.5" y="188.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >落盘 / 上传</text><text x="792.5" y="202.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >MCAP 分段 128 GB</text><text x="792.5" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >坞站/WiFi 批量上传</text><text x="792.5" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >哈希回执后可覆盖</text><line x1="860" y1="206.0" x2="885" y2="206.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="888" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >契约 topics</text><text x="888" y="84" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/video/ego_wrist</text><text x="888" y="100" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/video/palm</text><text x="888" y="116" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/ee_pose 60Hz</text><text x="888" y="132" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/gripper_width 200Hz</text><text x="888" y="148" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/tactile_l|r (N,6)</text><text x="888" y="164" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/wrench_wrist(+frame_id)</text><text x="888" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/imu/wrist 200Hz</text><text x="888" y="196" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/event/sync</text><text x="888" y="212" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/calibration</text><text x="20" y="394" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：手指驱动、末端与本体同构、触觉阵列与光学传感器并排共装是三个不可省的设计点；VIO 用 BSD 的 Basalt 而非 GPL 的 ORB-SLAM3（U-10）。</text></svg>