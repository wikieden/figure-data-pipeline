<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="五件采集设备的佩戴与安装位置：人身上的 D2 头戴、D3 胸戴手机、D1 手持 UMI、D4 手套，以及机器人上的 D5 回流录制器与遥操作站" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D0-2 设备在人与机器人身上的位置</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >左：采集者（human/device 轨）；中：遥操作员（robot 轨对齐集）；右：部署机器人（robot 轨 fleet）。颜色 = 数据轨。</text><circle cx="190" cy="92" r="20" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1.5"/><path d="M190,112 L190,220" stroke="currentColor" stroke-width="2"/><path d="M190,132 L142,188 M190,132 L238,188" stroke="currentColor" stroke-width="2" fill="none"/><path d="M190,220 L158,310 M190,220 L222,310" stroke="currentColor" stroke-width="2" fill="none"/><text x="190" y="338" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >采集者（方案 A 或 B 由设备档案决定）</text><rect x="20" y="66" width="150" height="70" rx="5" fill="rgba(128,136,144,0.08)" stroke="#eb6834" stroke-width="1.5" opacity="1"></rect><text x="28" y="81" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >D2 头戴参考套件</text><text x="28" y="95" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >主 RGB 俯角 15–25°</text><text x="28" y="109" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >双目 SLAM · 双 IMU</text><text x="28" y="123" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >同步脉冲输出 ⇒ 主时钟</text><line x1="170" y1="101.0" x2="205" y2="82" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="205" cy="82" r="4" fill="#eb6834"/><rect x="20" y="148" width="150" height="56" rx="5" fill="rgba(128,136,144,0.08)" stroke="#eb6834" stroke-width="1.5" opacity="1"></rect><text x="28" y="163" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >D3 Creator 手机</text><text x="28" y="177" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >胸戴 / 头带支架</text><text x="28" y="191" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >端上脱敏后才上传</text><line x1="170" y1="176.0" x2="190" y2="154" stroke="#eb6834" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="190" cy="154" r="4" fill="#eb6834"/><rect x="20" y="220" width="150" height="56" rx="5" fill="rgba(128,136,144,0.08)" stroke="#1baf7a" stroke-width="1.5" opacity="1"></rect><text x="28" y="235" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >D1 触觉同构 UMI</text><text x="28" y="249" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >手持，手指驱动</text><text x="28" y="263" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >指尖触觉 + 腕相机</text><line x1="170" y1="248.0" x2="240" y2="190" stroke="#1baf7a" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="240" cy="190" r="4" fill="#1baf7a"/><circle cx="500" cy="92" r="20" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1.5"/><path d="M500,112 L500,220" stroke="currentColor" stroke-width="2"/><path d="M500,132 L452,188 M500,132 L548,188" stroke="currentColor" stroke-width="2" fill="none"/><path d="M500,220 L468,310 M500,220 L532,310" stroke="currentColor" stroke-width="2" fill="none"/><text x="500" y="338" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >遥操作员（D4 站）</text><rect x="345" y="66" width="130" height="56" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="353" y="81" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >Quest 3 头显</text><text x="353" y="95" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >手腕位姿 60–90 Hz</text><text x="353" y="109" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >机器人相机回传</text><line x1="475" y1="94.0" x2="485" y2="92" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="485" cy="92" r="4" fill="#2a78d6"/><rect x="560" y="140" width="150" height="56" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="568" y="155" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >数据手套 ×2</text><text x="568" y="169" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >逐指关节 ≥200 Hz</text><text x="568" y="183" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >接管键 / 脚踏 ≤10 ms</text><line x1="560" y1="168.0" x2="548" y2="188" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="548" cy="188" r="4" fill="#2a78d6"/><rect x="560" y="220" width="150" height="42" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="568" y="235" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >速度带节拍器（R-14）</text><text x="568" y="249" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >语音口令 → /event/task</text><line x1="560" y1="241.0" x2="510" y2="220" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="510" cy="220" r="4" fill="#2a78d6"/><rect x="822" y="72" width="36" height="36" rx="6" fill="rgba(42,120,214,0.10)" stroke="currentColor" stroke-width="1.5" opacity="1"></rect><rect x="810" y="114" width="60" height="100" rx="8" fill="rgba(42,120,214,0.10)" stroke="currentColor" stroke-width="1.5" opacity="1"></rect><path d="M810,130 L770,190 M870,130 L910,190" stroke="currentColor" stroke-width="2.5" fill="none"/><path d="M826,214 L826,310 M854,214 L854,310" stroke="currentColor" stroke-width="2.5" fill="none"/><circle cx="832" cy="88" r="3" fill="#2a78d6"/><circle cx="848" cy="88" r="3" fill="#2a78d6"/><text x="840" y="338" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >部署机器人（D5 固件）</text><rect x="720" y="66" width="110" height="42" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="728" y="81" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >本体相机</text><text x="728" y="95" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >头 / 腕 / 掌 30 Hz</text><line x1="830" y1="87.0" x2="832" y2="88" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="832" cy="88" r="4" fill="#2a78d6"/><rect x="890" y="110" width="100" height="42" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="898" y="125" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >OOD 探针</text><text x="898" y="139" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >隐状态 10 Hz</text><line x1="890" y1="131.0" x2="870" y2="150" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="870" cy="150" r="4" fill="#2a78d6"/><rect x="882" y="190" width="112" height="56" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="890" y="205" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >环形缓冲 5 min</text><text x="890" y="219" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >固化 [−30,+60] s</text><text x="890" y="233" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >一机一码</text><line x1="882" y1="218.0" x2="870" y2="200" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="870" cy="200" r="4" fill="#2a78d6"/><rect x="720" y="250" width="110" height="42" rx="5" fill="rgba(128,136,144,0.08)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="728" y="265" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >关节流 200 Hz</text><text x="728" y="279" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >触觉 / 力矩</text><line x1="830" y1="271.0" x2="770" y2="190" stroke="#2a78d6" stroke-width="1.2" marker-end="url(#arr)"/><circle cx="770" cy="190" r="4" fill="#2a78d6"/><path d="M190,370 C300,410 400,410 500,370" stroke="rgba(128,136,144,0.7)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><text x="345" y="414" font-size="10.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >配对采集：D2 与 D1 同戴 / D4 手套与本体复现（§7）</text><path d="M500,370 C600,410 740,410 840,370" stroke="rgba(128,136,144,0.7)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/><text x="670" y="414" font-size="10.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >同一时钟同一契约：D4 干预段与 D5 干预段共用 /event/intervention</text><text x="20" y="454" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：人身上三件设备可同时佩戴（这就是配对采集的物理前提）；D5 不是新硬件而是本体上的固件规范；控制点 2 最贵的干预段只在中、右两栏产生。</text></svg>