" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="194" y="190" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="268.0" y="209" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >规格冻结 / U-35 选型</text><rect x="354" y="190" width="308" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="354" y="190" width="308" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="508.0" y="209" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >EVT 10–50 台</text><rect x="674" y="190" width="148" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="674" y="190" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="748.0" y="209" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >DVT 参考设计开源 · 不做 PVT</text><text x="985" y="208" font-size="10" text-anchor="end" font-weight="bold" fill="currentColor" >$6–30k（含 NRE）</text><text x="20" y="264" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D3 Creator 手机</text><rect x="20" y="272" width="160" height="3" rx="1" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="194" y="246" width="148" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="194" y="246" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="268.0" y="265" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >内部试用 · 脱敏模型</text><rect x="354" y="246" width="148" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="354" y="246" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="428.0" y="265" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >DQAF 反馈 · 同意三档</text><rect x="514" y="246" width="148" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="514" y="246" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="588.0" y="265" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >千人试点</text><rect x="674" y="246" width="148" height="30" rx="5" fill="#eb6834" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="674" y="246" width="148" height="30" rx="5" fill="none" stroke="#eb6834" stroke-width="1.2" opacity="1"></rect><text x="748.0" y="265" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >千人网络 PL1</text><text x="985" y="264" font-size="10" text-anchor="end" font-weight="bold" fill="currentColor" >≈$0 + App 人力</text><text x="20" y="320" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D4 遥操作站 + 手套</text><rect x="20" y="328" width="160" height="3" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="194" y="302" width="148" height="30" rx="5" fill="#2a78d6" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="194" y="302" width="148" height="30" rx="5" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="268.0" y="321" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >H0 1 站（U-36 手套选型）</text><rect x="354" y="302" width="308" height="30" rx="5" fill="#2a78d6" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="354" y="302" width="308" height="30" rx="5" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="508.0" y="321" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >H1 3–5 站</text><rect x="674" y="302" width="148" height="30" rx="5" fill="#2a78d6" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="674" y="302" width="148" height="30" rx="5" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="748.0" y="321" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >按评测农场需求扩</text><text x="985" y="320" font-size="10" text-anchor="end" font-weight="bold" fill="currentColor" >$5–10k + $20–40k</text><text x="20" y="376" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D5 车队回流录制器</text><rect x="20" y="384" width="160" height="3" rx="1" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="354" y="358" width="308" height="30" rx="5" fill="#2a78d6" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="354" y="358" width="308" height="30" rx="5" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="508.0" y="377" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >M3 回流接口 · 固件规范</text><rect x="674" y="358" width="148" height="30" rx="5" fill="#2a78d6" stroke="none" stroke-width="1" opacity="0.18"></rect><rect x="674" y="358" width="148" height="30" rx="5" fill="none" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="748.0" y="377" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >H2 车队上线</text><text x="985" y="376" font-size="10" text-anchor="end" font-weight="bold" fill="currentColor" >存储 + 固件人力</text><text x="985" y="108" font-size="10" text-anchor="end" font-weight="bold" fill="rgba(128,136,144,0.9)" >12 个月费用</text><rect x="20" y="414" width="960" height="30" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="30" y="434" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >合计硬件 ≈ $40–90k / 12 个月</text><text x="970" y="434" font-size="10" text-anchor="end" font-weight="normal" fill="rgba(128,136,144,0.9)" >比 program-plan §4 原口径少 $150–300k（PVT 与 P2 冻结，U-24）</text><text x="20" y="468" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：钱最多的是 D4 手套与 D2 EVT；D3 与 D5 几乎不花硬件钱但吃人力；每个阶段的第一个条都以一项治理选型（U-34/35/36）为前置。</text></svg>