<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="五件设备的里程碑与预算：P0、H0、H1、M3、H2 五个阶段上每件设备的台数与费用，合计 12 个月硬件约 4 万至 9 万美元" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D8 里程碑 × 设备：台数与预算</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >横轴按 program-plan 时间线（0–3 / 3–6 / 6–12 / 12–24 月）；条上写台数，右列写量级费用。PVT 冻结后硬件总盘子比原口径少 $150–300k。</text><rect x="190" y="80" width="156" height="34" rx="4" fill="rgba(128,136,144,0.08)" stroke="none" stroke-width="1" opacity="1"></rect><text x="268.0" y="94" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >0–3 月</text><text x="268.0" y="108" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >P0 / H0 / M1</text><rect x="350" y="80" width="156" height="34" rx="4" fill="rgba(128,136,144,0.08)" stroke="none" stroke-width="1" opacity="1"></rect><text x="428.0" y="94" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >3–6 月</text><text x="428.0" y="108" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >H0 → H1 / M2</text><rect x="510" y="80" width="156" height="34" rx="4" fill="rgba(128,136,144,0.08)" stroke="none" stroke-width="1" opacity="1"></rect><text x="588.0" y="94" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >6–12 月</text><text x="588.0" y="108" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >H1 / M3</text><rect x="670" y="80" width="156" height="34" rx="4" fill="rgba(128,136,144,