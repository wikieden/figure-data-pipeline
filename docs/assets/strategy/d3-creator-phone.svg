<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="1080" height="370" role="img" aria-label="D3 Creator 手机套件的数据流：手机相机、IMU 与平台 VIO 经软同步，在端上强制脱敏并给出即时质量反馈后分片上传，另可扫描场景生成仿真孪生" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D3 Creator 手机采集套件（P0 → PL1）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >服务：human 轨众包 · 供给接口 PL1 · U-22 场景扫描 | 里程碑：P0 内部试用 → H1 千人试点 → H2 千人网络 | BOM ≈$0（用户自有手机）+ 支架 &lt;$15</text><text x="20" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >传感器（原生频率）</text><rect x="20" y="70" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="70" width="5" height="32" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="83" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >手机主相机（胸戴/头带，俯角可调）</text><text x="32" y="97" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >1080p@60 / 4K@30</text><line x1="240" y1="86" x2="270" y2="86" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="110" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="110" width="5" height="32" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="123" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >手机 IMU</text><text x="32" y="137" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >100–200 Hz</text><line x1="240" y1="126" x2="270" y2="126" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="150" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="150" width="5" height="32" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="163" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >ARKit/ARCore VIO 位姿</text><text x="32" y="177" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >60 Hz</text><line x1="240" y1="166" x2="270" y2="166" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="190" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="190" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="203" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >麦克风（口令段）</text><text x="32" y="217" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >16 kHz</text><line x1="240" y1="206" x2="270" y2="206" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="230" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="230" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="243" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >LiDAR / 多帧场景扫描（可选）</text><text x="32" y="257" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >一次性</text><line x1="240" y1="246" x2="270" y2="246" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="270" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="270" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="283" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >屏幕 + 声音录制指示</text><text x="32" y="297" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >事件</text><line x1="240" y1="286" x2="270" y2="286" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="270" y="70" width="170" height="232" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="355.0" y="168.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >同步 / 时钟</text><text x="355.0" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >平台时间戳（单设备，软同步）</text><text x="355.0" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >视觉↔位姿 ≤15 ms（human 轨预算）</text><text x="355.0" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >GeoCalib 标定（U-11 #11）</text><line x1="440" y1="186.0" x2="470" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="470" y="70" width="225" height="232" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" /><text x="582.5" y="154.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >机上处理</text><text x="582.5" y="168.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >平台硬编 h264/h265</text><text x="582.5" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >端上脱敏强制（上传前，方案 A）</text><text x="582.5" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >DQAF 式 30 s 反馈：手部可见率 · 曝光 · 时长</text><text x="582.5" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >同意三档 + region</text><text x="582.5" y="224.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >场景扫描 → 孪生（U-22）</text><line x1="695" y1="186.0" x2="725" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="725" y="70" width="135" height="232" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="792.5" y="168.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >落盘 / 上传</text><text x="792.5" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >App 私有沙箱</text><text x="792.5" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >分片上传 + 内容哈希</text><text x="792.5" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >上传后本地删除</text><line x1="860" y1="186.0" x2="885" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="888" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >契约 topics</text><text x="888" y="84" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/video/ego</text><text x="888" y="100" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/imu/phone</text><text x="888" y="116" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/phone_pose 60Hz</text><text x="888" y="132" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/event/task</text><text x="888" y="148" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/task_goal</text><text x="888" y="164" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/consent</text><text x="888" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/device（机型/支架/标定）</text><text x="888" y="196" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/privacy（脱敏模型版本）</text><text x="20" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：唯一零设备成本的入口，也是唯一只允许方案 A 的设备：未脱敏帧永不离开手机；场景扫描是它区别于 Figure Index 的功能点。</text></svg>