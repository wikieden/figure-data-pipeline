<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="三家路线在两轴上的位置：横轴为预训练动作真值来源（硬件记录、视觉伪动作、仿真真值），纵轴为部署适应机制（梯度微调到零梯度提示），并标注规模与 scaling 证据" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >图 1　三家路线：左轴分道，右轴收敛</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >横轴 = 预训练数据的动作真值从哪来；纵轴 = 新任务怎么上线。气泡内为公开规模与 scaling 证据（全部自报⚠️）。</text><rect x="120" y="80" width="740" height="340" rx="8" fill="rgba(128,136,144,0.04)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><line x1="120.0" y1="80" x2="120.0" y2="420" stroke="rgba(128,136,144,0.28)" stroke-width="1"/><text x="243.33333333333331" y="442" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >硬件记录真值</text><text x="243.33333333333331" y="458" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >UMI / Data Hands / 遥操作</text><line x1="366.66666666666663" y1="80" x2="366.66666666666663" y2="420" stroke="rgba(128,136,144,0.28)" stroke-width="1"/><text x="489.99999999999994" y="442" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >视觉伪动作</text><text x="489.99999999999994" y="458" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >头戴视频 → 3D 手姿</text><line x1="613.3333333333333" y1="80" x2="613.3333333333333" y2="420" stroke="rgba(128,136,144,0.28)" stroke-width="1"/><text x="736.6666666666666" y="442" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >仿真真值 + 视频可供性</text><text x="736.6666666666666" y="458" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >Isaac Lab / 互联网视频</text><text x="490.0" y="482" font-size="10.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >预训练动作真值来源 →</text><line x1="120" y1="369.0" x2="860" y2="369.0" stroke="rgba(128,136,144,0.28)" stroke-width="1" stroke-dasharray="3 3"/><text x="112" y="373.0" font-size="9.5" text-anchor="end" font-weight="normal" fill="rgba(128,136,144,0.9)" >每任务 ≤10 h 微调</text><line x1="120" y1="267.0" x2="860" y2="267.0" stroke="rgba(128,136,144,0.28)" stroke-width="1" stroke-dasharray="3 3"/><text x="112" y="271.0" font-size="9.5" text-anchor="end" font-weight="normal" fill="rgba(128,136,144,0.9)" >每任务 ~1 h 微调</text><line x1="120" y1="131.0" x2="860" y2="131.0" stroke="rgba(128,136,144,0.28)" stroke-width="1" stroke-dasharray="3 3"/><text x="112" y="135.0" font-size="9.5" text-anchor="end" font-weight="normal" fill="rgba(128,136,144,0.9)" >分钟级 / 零梯度提示</text><text transform="translate(28,250.0) rotate(-90)" font-size="10.5" text-anchor="middle" fill="rgba(128,136,144,0.9)">部署适应机制 →</text><circle cx="243.33333333333331" cy="222.79999999999998" r="88" fill="#1baf7a" opacity="0.14" stroke="#1baf7a" stroke-width="2"/><text x="243.33333333333331" y="198.79999999999998" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Generalist GEN-1/1.5</text><text x="243.33333333333331" y="212.79999999999998" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >50 万 h，无机器人/仿真</text><text x="243.33333333333331" y="226.79999999999998" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >每任务 ~1 h；12 s 演示零梯度</text><text x="243.33333333333331" y="240.79999999999998" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >L(D) 幂律 · 7B+ 骨化相变</text><text x="243.33333333333331" y="254.79999999999998" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >三任务 99%（自报）</text><circle cx="490.0" cy="290.8" r="92" fill="#eb6834" opacity="0.14" stroke="#eb6834" stroke-width="2"/><text x="490.0" y="266.8" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Dyna DYNA-2 (WAM)</text><text x="490.0" y="280.8" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >100 万 h 头戴视频，零机器人</text><text x="490.0" y="294.8" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >每任务 ≤10 h；13 min 拧瓶盖</text><text x="490.0" y="308.8" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >1K→1M 幂律；零样本 6.3→16.4%</text><text x="490.0" y="322.8" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >客户质检 46→87%（自报）</text><circle cx="736.6666666666666" cy="182.0" r="88" fill="#eda100" opacity="0.14" stroke="#eda100" stroke-width="2"/><text x="736.6666666666666" y="158.0" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Skild S1 (ICL)</text><text x="736.6666666666666" y="172.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >10 万具身仿真 + 互联网视频</text><text x="736.6666666666666" y="186.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >1 条演示零梯度 ≈ 380 条遥操作</text><text x="736.6666666666666" y="200.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >1K→100K 阶梯 66% vs 9%</text><text x="736.6666666666666" y="214.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >$100M ARR · 60+ 客户</text><text x="490.0" y="410" font-size="9.5" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >共同点：三家都需要对齐层——每任务分钟到小时级机器人数据 + 演示即提示；没有一家靠预训练直接到部署精度</text><text x="20" y="500" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：分道在左轴——谁提供动作真值决定了采集设备、覆盖范围与精度上限；收敛在右轴——没有一家靠预训练直接到部署精度。本仓库四轨设计把三种真值来源都留了接口。</text></svg>