<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-label="产业路线与学术主线的对应：四条学术线（人类视频用法、世界-动作模型、上下文提示、真机 RL 自举）各自的代表工作，与三家公司的取用关系" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >图 2　三家各持学术界四个接口中的两个</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >上排：学术接口与代表工作；下排：公司。连线 = 该公司公开路线使用了该接口。</text><rect x="30" y="70" width="225" height="92" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="142" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor" >① 伪动作 / 人类视频用法</text><text x="142" y="110" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >survey 2606.00054 四类</text><text x="142" y="126" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >EgoDex · HumanScale · HumanNet</text><text x="142" y="142" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >反方：ActiveMimic · GRA</text><rect x="270" y="70" width="225" height="92" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="382" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor" >② 世界-动作模型目标</text><text x="382" y="110" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >DreamZero 2602.15922</text><text x="382" y="126" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >GE-Act 2.0 · Cosmos Policy</text><text x="382" y="142" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >教程 2607.00836 · Cortex 2.0</text><rect x="510" y="70" width="225" height="92" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="622" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor" >③ 上下文提示 / 演示即提示</text><text x="622" y="110" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >BPP 2606.30457 (iPhUMI)</text><text x="622" y="126" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >2505.20795 · ICLR 2603.07530</text><text x="622" y="142" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >RoboTTT</text><rect x="750" y="70" width="225" height="92" rx="6" fill="rgba(42,120,214,0.08)" stroke="#2a78d6" stroke-width="1.2" opacity="1"></rect><text x="862" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="currentColor" >④ 真机 RL / 奖励模型自举</text><text x="862" y="110" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >π*0.6 RECAP · SimpleVLA-RL</text><text x="862" y="126" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >RehearseVLA</text><text x="862" y="142" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >Eureka 谱系（Jason Ma）</text><rect x="30" y="300" width="225" height="70" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="30" y="300" width="6" height="70" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="142" y="322" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Dyna</text><text x="142" y="340" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >DYNA-1 奖励模型自举 →</text><text x="142" y="354" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >DYNA-2 WAM + 手姿伪动作</text><path d="M142,162 C142,230 142,230 142,300" stroke="#eb6834" stroke-width="1.4" fill="none"/><path d="M382,162 C382,230 142,230 142,300" stroke="#eb6834" stroke-width="1.4" fill="none"/><path d="M862,162 C862,230 142,230 142,300" stroke="#eb6834" stroke-width="1.4" fill="none"/><rect x="270" y="300" width="225" height="70" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="270" y="300" width="6" height="70" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="382" y="322" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Generalist</text><text x="382" y="340" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >硬件真值绕过①；GEN-1.5 物理提示</text><text x="382" y="354" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >公开反对世界模型②</text><path d="M622,162 C622,230 382,230 382,300" stroke="#1baf7a" stroke-width="1.4" fill="none"/><rect x="510" y="300" width="225" height="70" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="510" y="300" width="6" height="70" rx="2" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><text x="622" y="322" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >Skild</text><text x="622" y="340" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >可供性 / 逆动力学 + 仿真</text><text x="622" y="354" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >S1 上下文学习</text><path d="M142,162 C142,230 622,230 622,300" stroke="#eda100" stroke-width="1.4" fill="none"/><path d="M622,162 C622,230 622,230 622,300" stroke="#eda100" stroke-width="1.4" fill="none"/><rect x="750" y="300" width="225" height="70" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="750" y="300" width="6" height="70" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="862" y="322" font-size="11.5" text-anchor="middle" font-weight="bold" fill="currentColor" >NVIDIA / AgiBot / PI</text><text x="862" y="340" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >GR00T N1.7 伪标签；DreamZero、</text><text x="862" y="354" font-size="9" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >GE-Act 2.0 WAM；π0.7 / RECAP</text><path d="M142,162 C142,230 862,230 862,300" stroke="#2a78d6" stroke-width="1.4" fill="none"/><path d="M382,162 C382,230 862,230 862,300" stroke="#2a78d6" stroke-width="1.4" fill="none"/><path d="M862,162 C862,230 862,230 862,300" stroke="#2a78d6" stroke-width="1.4" fill="none"/><text x="20" y="400" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：没有一家同时持有硬件真值 + 视频规模 + 仿真规模；Generalist 是唯一不用①的（真值由设备记录），也是唯一公开反对②的。</text><text x="20" y="420" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >WAM 目标②已有 Dyna、NVIDIA、AgiBot、Cosmos 四家独立验证，过了 CLAUDE.md 决策 7 的&quot;≥2 家&quot;门槛 → U-37。本仓库四轨数据层对四个接口都留了消费入口。</text><text x="20" y="450" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >来源：各公司博客/PR 与 arXiv 摘要（本文 §7、§9）；全部性能数字为公司自报。</text></svg>