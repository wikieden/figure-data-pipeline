128,136,144,0.9)" >512 GB 加密</text><rect x="180" y="325" width="34" height="16" rx="8" fill="rgba(128,136,144,0.22)" stroke="currentColor" stroke-width="1" opacity="1"></rect><circle cx="188" cy="333" r="6" fill="#eb6834" stroke="currentColor" stroke-width="0.7"/><circle cx="340" cy="205" r="7" fill="rgba(128,136,144,0.22)" stroke="currentColor" stroke-width="1.2"/><line x1="400" y1="150" x2="260" y2="226" stroke="currentColor" stroke-width="0.9"/><circle cx="260" cy="226" r="2" fill="currentColor"/><circle cx="400" cy="150" r="9" fill="#2a78d6"/><text x="400" y="153.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >1</text><line x1="100" y1="150" x2="177" y2="190" stroke="currentColor" stroke-width="0.9"/><circle cx="177" cy="190" r="2" fill="currentColor"/><circle cx="100" cy="150" r="9" fill="#2a78d6"/><text x="100" y="153.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >2</text><line x1="440" y1="410" x2="350" y2="335" stroke="currentColor" stroke-width="0.9"/><circle cx="350" cy="335" r="2" fill="currentColor"/><circle cx="440" cy="410" r="9" fill="#2a78d6"/><text x="440" y="413.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >3</text><line x1="100" y1="410" x2="197" y2="333" stroke="currentColor" stroke-width="0.9"/><circle cx="197" cy="333" r="2" fill="currentColor"/><circle cx="100" cy="410" r="9" fill="#2a78d6"/><text x="100" y="413.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >4</text><line x1="440" y1="220" x2="340" y2="205" stroke="currentColor" stroke-width="0.9"/><circle cx="340" cy="205" r="2" fill="currentColor"/><circle cx="440" cy="220" r="9" fill="#2a78d6"/><text x="440" y="223.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >5</text><text x="560" y="80" font-size="10.5" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >胸前灯环语义（旁观者可读）</text><circle cx="575" cy="110" r="9" fill="#1baf7a" stroke="currentColor" stroke-width="0.6"/><text x="595" y="114" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >常绿</text><text x="690" y="114" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >自主运行，不录制（环形缓冲仅内存）</text><circle cx="575" cy="146" r="9" fill="#1baf7a" stroke="currentColor" stroke-width="0.6"/><text x="595" y="150" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >绿闪</text><text x="690" y="150" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >环形缓冲固化中（OOD/接管触发）</text><circle cx="575" cy="182" r="9" fill="#2a78d6" stroke="currentColor" stroke-width="0.6"/><text x="595" y="186" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >常蓝</text><text x="690" y="186" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >遥操作/远程在场（有人在看）</text><circle cx="575" cy="218" r="9" fill="#eda100" stroke="currentColor" stroke-width="0.6"/><text x="595" y="222" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >黄</text><text x="690" y="222" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >脱敏模式 A（家庭部署）</text><circle cx="575" cy="254" r="9" fill="#e5484d" stroke="currentColor" stroke-width="0.6"/><text x="595" y="258" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >红</text><text x="690" y="258" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >接管中 / 急停</text><circle cx="575" cy="290" r="9" fill="#9aa3ad" stroke="currentColor" stroke-width="0.6"/><text x="595" y="294" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >灭 + 声音提示</text><text x="690" y="294" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >物理停录已按下，本机不采</text><circle cx="569" cy="340" r="9" fill="#2a78d6"/><text x="569" y="343.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >1</text><text x="586" y="338" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >胸前灯环</text><text x="586" y="351" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >硬连线，固件不可关；状态见上表</text><circle cx="569" cy="370" r="9" fill="#2a78d6"/><text x="569" y="373.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >2</text><text x="586" y="368" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >一机一码铭牌</text><text x="586" y="381" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >device_id 二维码 + firmware 版本</text><circle cx="569" cy="400" r="9" fill="#2a78d6"/><text x="569" y="403.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >3</text><text x="586" y="398" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >可拆存储舱</text><text x="586" y="411" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >加密 SSD，回坞或人工取回</text><circle cx="569" cy="430" r="9" fill="#2a78d6"/><text x="569" y="433.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >4</text><text x="586" y="428" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >物理停录开关</text><text x="586" y="441" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >按下即停录并清空环形缓冲</text><circle cx="569" cy="460" r="9" fill="#2a78d6"/><text x="569" y="463.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >5</text><text x="586" y="458" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >远程在场提示</text><text x="586" y="471" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >远程接管时亮灯 + 提示音（compliance §4）</text></svg>