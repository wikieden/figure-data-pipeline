<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 432" width="1000" height="432" role="img" aria-label="五件采集设备与四条数据轨、三个控制点的对应关系，以及三组配对采集" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="30" y="60" width="176" height="54" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="118.0" y="83.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >D1 触觉同构 UMI</text><text x="118.0" y="98.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >device 轨</text><rect x="30" y="60" width="6" height="54" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><rect x="222" y="60" width="176" height="54" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="310.0" y="83.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >D2 头戴参考套件</text><text x="310.0" y="98.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >human 轨（方案 B）</text><rect x="222" y="60" width="6" height="54" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="414" y="60" width="176" height="54" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="502.0" y="83.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >D3 Creator 手机</text><text x="502.0" y="98.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >human 轨（方案 A）</text><rect x="414" y="60" width="6" height="54" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="606" y="60" width="176" height="54" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="694.0" y="83.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >D4 遥操作站+手套</text><text x="694.0" y="98.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >robot 轨</text><rect x="606" y="60" width="6" height="54" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="798" y="60" width="176" height="54" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="886.0" y="83.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >D5 车队回流录制器</text><text x="886.0" y="98.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >robot 轨（fleet）</text><rect x="798" y="60" width="6" height="54" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="30" y="240" width="300" height="60" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="180.0" y="266.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >控制点 1 评测校准数据</text><text x="180.0" y="280.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >D4 校准演示 · D5 真机复核 · D1 孪生对照</text><rect x="350" y="240" width="300" height="60" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="500.0" y="266.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >控制点 2 对齐层语料</text><text x="500.0" y="280.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >D1+D2 同戴配对 · D4 对齐集与干预段 · D5 干预段</text><rect x="670" y="240" width="300" height="60" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="820.0" y="266.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >控制点 3 契约与同意图</text><text x="820.0" y="280.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >全部设备落盘同一 MCAP 契约 · D3/D2 同意与脱敏元数据 · D5 一机一码</text><line x1="118" y1="114" x2="500" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="118" y1="114" x2="180" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="310" y1="114" x2="500" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="310" y1="114" x2="820" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="502" y1="114" x2="820" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="694" y1="114" x2="180" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="694" y1="114" x2="500" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="886" y1="114" x2="500" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="886" y1="114" x2="180" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><line x1="886" y1="114" x2="820" y2="240" stroke="rgba(128,136,144,0.6)" stroke-width="1" marker-end="url(#arr)"/><text x="20" y="330" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >配对采集（同一操作者、同一任务、同一时钟）：</text><text x="20" y="350" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >① D2 + D1 同时佩戴 → 视觉伪标签 vs 硬件真值（伪标签校准）；② D2 + 固定 exo 相机 → ego+exo（U-33，100 h 探针）；③ D1 触觉阵列 + 光学传感器并排 → 跨传感器迁移（FTP-1/HTT 证据）</text><text x="20" y="370" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >共性：单调 ns 时钟 + 硬件触发/同步 LED；出厂标定随数据走；硬连线录制 LED + 遮挡即停录；方案 A（端上脱敏）/ 方案 B（加密 raw 进 L3）由设备档案决定；固件落盘即 MCAP 契约。</text><text x="20" y="396" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >不做的设备：P2 眼镜量产版（U-24）、TwinDEX 式外骨骼（U-04 前不评估）、RDT2 式基站定位、UMI-3D LiDAR 版、力反馈主从臂（接触密集任务备用）。</text><text x="20" y="416" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：每件设备都至少喂一个控制点；D3 是唯一零成本入口但只服务控制点 3 与预训练供给；干预段（控制点 2 的最贵部分）只来自 D4/D5。</text></svg>