<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" width="1080" height="300" role="img" aria-label="价值链上的三个战略控制点：评测校准数据、对齐层语料、数据契约与同意图；原始供给、设备、骨干、引擎、训练场可外购或开放" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="70" width="122" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="rgba(128,136,144,0.9)" stroke-width="1" /><text x="81.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >原始供给</text><text x="81.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >众包视频/训练场小时</text><text x="81.0" y="174" font-size="10" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >可外购 $3–140/h</text><line x1="142" y1="113" x2="152" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="152" y="70" width="122" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="rgba(128,136,144,0.9)" stroke-width="1" /><text x="213.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >采集设备</text><text x="213.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >头戴/UMI/手套</text><text x="213.0" y="188" font-size="10" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >规格已收敛，可外购</text><line x1="274" y1="113" x2="284" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="284" y="70" width="122" height="86" rx="6" fill="rgba(42,120,214,0.14)" stroke="#2a78d6" stroke-width="2.5" /><text x="345.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >数据契约+同意图</text><text x="345.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >扩展列 · 机器可读同意</text><text x="345.0" y="60" font-size="11" text-anchor="middle" font-weight="bold" fill="#2a78d6" >控制点</text><text x="345.0" y="174" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >控制点 3：合规交付条件</text><line x1="406" y1="113" x2="416" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="416" y="70" width="122" height="86" rx="6" fill="rgba(42,120,214,0.14)" stroke="#2a78d6" stroke-width="2.5" /><text x="477.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >对齐层语料</text><text x="477.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >人↔机配对集 + 干预段</text><text x="477.0" y="60" font-size="11" text-anchor="middle" font-weight="bold" fill="#2a78d6" >控制点</text><text x="477.0" y="188" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >控制点 2：新任务适配速度</text><line x1="538" y1="113" x2="548" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="548" y="70" width="122" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="rgba(128,136,144,0.9)" stroke-width="1" /><text x="609.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >策展与估值</text><text x="609.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >段级标签 · 估值分数</text><text x="609.0" y="174" font-size="10" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >能力：方法公开、阈值私有</text><line x1="670" y1="113" x2="680" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="680" y="70" width="122" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="rgba(128,136,144,0.9)" stroke-width="1" /><text x="741.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >模型骨干</text><text x="741.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >VLM + 流匹配头</text><text x="741.0" y="188" font-size="10" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >开放：只抄共识</text><line x1="802" y1="113" x2="812" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="812" y="70" width="122" height="86" rx="6" fill="rgba(42,120,214,0.14)" stroke="#2a78d6" stroke-width="2.5" /><text x="873.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >评测校准数据</text><text x="873.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >真机↔孪生↔代理配对</text><text x="873.0" y="60" font-size="11" text-anchor="middle" font-weight="bold" fill="#2a78d6" >控制点</text><text x="873.0" y="174" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >控制点 1：定义什么是好数据</text><line x1="934" y1="113" x2="944" y2="113" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="944" y="70" width="122" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="rgba(128,136,144,0.9)" stroke-width="1" /><text x="1005.0" y="109.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >部署车队</text><text x="1005.0" y="124.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >客户现场</text><text x="1005.0" y="188" font-size="10" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >产干预段的来源</text><path d="M 1005.0 156 C 1005.0 212, 477.0 212, 477.0 156" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="741.0" y="226" font-size="11" text-anchor="middle" font-weight="normal" fill="#eb6834" >每次部署产生干预段 → 对齐层变厚</text><text x="24" y="250" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >三问检验：拿掉它，对手的新任务上线成本会不会上升？它是否随每次部署或每季度自动变厚？它能不能用钱买到？</text><text x="24" y="270" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >三问都答对才是控制点；只答对一个是能力。北极星“新任务上线成本”的定价权就落在这三处。</text></svg>