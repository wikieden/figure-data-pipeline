<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="八条方向线条的依赖：L2 平台是底座，L1/L4/L5 产数据，L3 处理，L6 消费，L7 裁决并反向分配预算，L8 合规贯穿全部" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="40" y="350" width="740" height="56" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="410.0" y="382.2" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >L2 数据平台 · 契约 0.3 · lineage · 同意图（底座）</text><rect x="40" y="250" width="230" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="155.0" y="281.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L1 采集形态</text><text x="155.0" y="296.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >robot/human/device + Creator + 车队</text><line x1="240" y1="250" x2="240" y2="214" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="290" y="250" width="230" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="405.0" y="281.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L4 人→机对齐</text><text x="405.0" y="296.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >相机系相对末端伪标签 · 重定向</text><line x1="405" y1="250" x2="405" y2="214" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="540" y="250" width="230" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="655.0" y="281.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L5 仿真/世界模型</text><text x="655.0" y="296.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >评测孪生 → 长尾 → 增殖 ≤4:1</text><line x1="655" y1="250" x2="655" y2="214" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="40" y="150" width="730" height="60" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="2" /><text x="405.0" y="176.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L3 段级策展与估值</text><text x="405.0" y="191.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >进展/空闲/失败/恢复段 · PSD→SIEVE→ATHENA · 元数据条件（不删只标）</text><line x1="405" y1="150" x2="405" y2="116" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="405.0" y="127.0" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >配方 yaml（版本化，哈希入 lineage）</text><rect x="40" y="50" width="350" height="62" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="215.0" y="77.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L6 配方与训练数据</text><text x="215.0" y="92.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >human ≥50% 起点 · 元数据条件化 · 专家数据 ≤100 h/任务</text><rect x="420" y="50" width="350" height="62" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="2" /><text x="595.0" y="77.35" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >L7 评测与闭环</text><text x="595.0" y="92.35" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >分级得分 · 序贯检验 · 三层代理 · 干预段回流</text><line x1="390" y1="81" x2="420" y2="81" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="405.0" y="75.0" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >checkpoint</text><line x1="90" y1="210" x2="90" y2="250" stroke="#eb6834" stroke-width="2" marker-end="url(#arr)"/><text x="98" y="226" font-size="10" text-anchor="start" font-weight="normal" fill="#eb6834" >预算反向分配</text><text x="98" y="240" font-size="10" text-anchor="start" font-weight="normal" fill="#eb6834" >→ L1 配额（源自 L7）</text><path d="M 600 112 C 600 130, 600 135, 600 150" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="612" y="136" font-size="10" text-anchor="start" font-weight="normal" fill="#eb6834" >分级得分/干预段 → 估值</text><rect x="800" y="40" width="80" height="366" rx="8" fill="rgba(235,104,52,0.10)" stroke="#eb6834" stroke-width="1.5"/><text x="840" y="225" font-size="11" text-anchor="middle" font-weight="bold" fill="#eb6834" transform="rotate(-90 840 225)">L8 合规 · 脱敏 · 标准（贯穿）</text><text x="20" y="422" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：蓝色框是自研控制点所在的线条；橙色箭头是“评测反向绑采集”的两条回路。</text></svg>