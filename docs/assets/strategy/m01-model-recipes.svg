<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 810" width="1100" height="810" role="img" aria-label="五家模型的训练与推理流程对照：数据来源、预训练、后训练、推理回路" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="26" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >图 M-1　五家模型的训练与推理流程对照（2026-09-16，全部一手页面；括号内为自报数字 ⚠️）</text><text x="20" y="44" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >列 = 阶段；行 = 公司。色条：蓝 = 机器人数据，橙 = 人类视频伪动作，绿 = 人类手持/穿戴硬件真值，黄 = 仿真。灰字 = 未披露。</text><rect x="140" y="64" width="228" height="22" rx="4" fill="rgba(128,136,144,0.10)" stroke="none" stroke-width="1" opacity="1"></rect><text x="254.0" y="79" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >预训练数据</text><rect x="376" y="64" width="228" height="22" rx="4" fill="rgba(128,136,144,0.10)" stroke="none" stroke-width="1" opacity="1"></rect><text x="490.0" y="79" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >预训练目标 / 骨干</text><rect x="612" y="64" width="228" height="22" rx="4" fill="rgba(128,136,144,0.10)" stroke="none" stroke-width="1" opacity="1"></rect><text x="726.0" y="79" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >后训练 / 适配</text><rect x="848" y="64" width="228" height="22" rx="4" fill="rgba(128,136,144,0.10)" stroke="none" stroke-width="1" opacity="1"></rect><text x="962.0" y="79" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >推理回路</text><rect x="20" y="94" width="110" height="124" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="20" y="94.0" width="6" height="41.333333333333336" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="135.33333333333334" width="6" height="41.333333333333336" rx="0" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="176.66666666666669" width="6" height="41.333333333333336" rx="0" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><text x="34" y="150.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >Figure</text><text x="34" y="166.0" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" >Helix 02</text><rect x="140" y="94" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="150" y="116" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >遥操作 ~500 h（Helix 初版）</text><text x="150" y="140" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >10→60 h 物流消融</text><text x="150" y="164" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >Index/Go-Big 人类第一视角视频</text><text x="150" y="188" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S0：1,000 h 重定向人体动捕</text><rect x="376" y="94" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="386" y="116" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >S2 = 7B 开源 VLM（互联网预训练）</text><text x="386" y="140" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S1 = 80M 视觉运动 Transformer</text><text x="386" y="164" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >视觉骨干在仿真预训练</text><text x="386" y="188" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S0 = 10M，20 万仿真环境 RL</text><rect x="612" y="94" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="622" y="116" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >单阶段端到端，回归损失</text><text x="622" y="140" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >事后指令自动标注（VLM）</text><text x="622" y="164" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >训练时加 S1/S2 时间偏移</text><text x="622" y="188" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >无逐任务微调 / 无独立动作头</text><rect x="848" y="94" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="858" y="116" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >S2 7–9 Hz 异步写共享隐向量</text><text x="858" y="140" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S1 200 Hz 读最新隐向量 + 观测</text><text x="858" y="164" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S0 1 kHz 跟踪关节目标</text><text x="858" y="188" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >双嵌入 GPU 各跑一层</text><rect x="20" y="226" width="110" height="124" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="20" y="226.0" width="6" height="62.0" rx="0" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="288.0" width="6" height="62.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="34" y="282.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >Dyna</text><text x="34" y="298.0" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" >DYNA-2</text><rect x="140" y="226" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="150" y="248" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >100 万+ h 头戴人类视频</text><text x="150" y="272" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >零机器人数据进预训练</text><text x="150" y="296" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >伪动作 = 腕位姿 + 拇食开合度</text><text x="150" y="320" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >无标注视频只进视频目标</text><rect x="376" y="226" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="386" y="248" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >视频扩散骨干，MoT（视频 / 动作各自 DiT）</text><text x="386" y="272" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >流匹配：视频 + λ·动作两条边际速度场</text><text x="386" y="296" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >动作 Transformer 更浅，只在早层接视频</text><text x="386" y="320" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >本体感知直接喂动作 Transformer</text><rect x="612" y="226" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="622" y="248" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >每任务 ≤10 h 机器人数据 SFT</text><text x="622" y="272" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >无联合训练、无人机对齐</text><text x="622" y="296" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >10 min 遥操作 → 五指拧瓶盖</text><text x="622" y="320" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >DYNA-1：RM 引导自主采集</text><rect x="848" y="226" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="858" y="248" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >推理不生成、不看未来视频</text><text x="858" y="272" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >VLM ~1 Hz → DYNA-2 ~10–15 Hz</text><text x="858" y="296" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >System 0 RL 控制器 ~1 kHz</text><text x="858" y="320" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >一步蒸馏可出视频（分析用）</text><rect x="20" y="358" width="110" height="124" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="20" y="358.0" width="6" height="124.0" rx="0" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="34" y="414.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >Sunday</text><text x="34" y="430.0" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" >ACT-2</text><rect x="140" y="358" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="150" y="380" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >Skill Capture Glove 传感化人类数据</text><text x="150" y="404" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >零遥操作</text><text x="150" y="428" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >Skill Transform 抹人 → 机器人域</text><text x="150" y="452" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >高质量子采样优于均匀</text><rect x="376" y="358" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="386" y="380" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >单一端到端网络（架构未披露）</text><text x="386" y="404" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >导航 + 操作合一，3D 地图条件化</text><text x="386" y="428" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >预训练规模 12.5%→100% 阶梯</text><text x="386" y="452" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >验证损失与成功率强相关</text><rect x="612" y="358" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="622" y="380" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >简单 SFT，四个独立副本</text><text x="622" y="404" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >单条示例教会可泛化折法</text><text x="622" y="428" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >恢复数据进后训练闭环</text><text x="622" y="452" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >部署零适配、权重固定</text><rect x="848" y="358" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="858" y="380" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >频率未披露</text><text x="858" y="404" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >毫米级操作到米级导航同一模型</text><text x="858" y="428" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >地图作为运行时输入</text><text x="858" y="452" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >48 小时采集→训练→评测</text><rect x="20" y="490" width="110" height="124" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="20" y="490.0" width="6" height="62.0" rx="0" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="552.0" width="6" height="62.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="34" y="546.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >Generalist</text><text x="34" y="562.0" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" >GEN-1.5</text><rect x="140" y="490" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="150" y="512" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >Data Hands 手持夹爪 50 万+ h</text><text x="150" y="536" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >+ 机器人自身 rollout</text><text x="150" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >零仿真、零遥操作</text><text x="150" y="584" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >约 9,000 种末端</text><rect x="376" y="490" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="386" y="512" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >99% 参数从零训练</text><text x="386" y="536" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >Harmonic Reasoning：感知/动作异步 token 单流</text><text x="386" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >7B+ 才吸收预训练（1B 骨化）</text><text x="386" y="584" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >持续预训练 8 个月三阶段</text><rect x="612" y="490" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="622" y="512" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >物理提示：3–12 s 演示进上下文，零梯度</text><text x="622" y="536" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >1 步 / 10 步微调（5 min 数据）</text><text x="622" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >RL 从经验学习 + 多模态人类引导</text><text x="622" y="584" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >盲测 A/B，MSE + 反向 KL 选型</text><rect x="848" y="490" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="858" y="512" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >100 Hz 动作轨迹</text><text x="858" y="536" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >30 s 滚动上下文 + 提示</text><text x="858" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >分页注意力做实时推理</text><text x="858" y="584" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >换末端中途自适应</text><rect x="20" y="622" width="110" height="124" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="20" y="622.0" width="6" height="41.333333333333336" rx="0" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="663.3333333333334" width="6" height="41.333333333333336" rx="0" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><rect x="20" y="704.6666666666666" width="6" height="41.333333333333336" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="34" y="678.0" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor" >Skild</text><text x="34" y="694.0" font-size="12" text-anchor="start" font-weight="normal" fill="currentColor" >Brain / S1</text><rect x="140" y="622" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="150" y="644" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >10 万种仿真本体，千年仿真时间</text><text x="150" y="668" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >互联网 / 头戴人类视频</text><text x="150" y="692" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >遥操作 + 部署数据做后训练</text><text x="150" y="716" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >UMI 列入自家数据源矩阵</text><rect x="376" y="622" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="386" y="644" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >分层：低频高层策略 → 高频低层策略</text><text x="386" y="668" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >S1 预训练 = 只用上下文演示指定任务</text><text x="386" y="692" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >「外循环教会从上下文学」</text><text x="386" y="716" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >架构 / 参数 / 训练细节未披露</text><rect x="612" y="622" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="622" y="644" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >微调 + 蒸馏到部署本体</text><text x="622" y="668" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >看视频 + &lt;1 h 机器人数据学新技能</text><text x="622" y="692" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >VLA 对照：2,000 条演示达 86%</text><text x="622" y="716" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >1 条演示 ≈ 380 条后训练</text><rect x="848" y="622" width="228" height="124" rx="6" fill="rgba(128,136,144,0.05)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><text x="858" y="644" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >视频提示零梯度执行未见任务</text><text x="858" y="668" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >10 分钟长程任务组合原子技能</text><text x="858" y="692" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >失败试次前置为提示（ICL）</text><text x="858" y="716" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >频率未披露</text><text x="20" y="762" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：五家在「预训练数据」列彻底分开，在「后训练」列收敛到几分钟到几小时机器人数据 + 演示即提示；只有 Figure 与 Dyna 公开了目标函数（回归 / 流匹配），</text><text x="20" y="780" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >Sunday 与 Skild 未披露架构，Generalist 只给方法名。来源与逐条引用见 research-model-recipes.md。</text></svg>