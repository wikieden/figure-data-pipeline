<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-label="车队数据飞轮：部署机器人在 OOD 探针触发下录制干预段，经段级策展进入 DAgger 后训练，新 checkpoint 过评测 CI 再部署" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="385.0" y="36.0" width="190" height="48" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="480.0" y="56.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >部署车队</text><text x="480.0" y="70.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >Adamo 稳态 ~1 介入/机/小时（自报⚠️）</text><rect x="662.1281292110203" y="118.5" width="190" height="48" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="757.1281292110203" y="139.0" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >OOD 探针触发录制</text><text x="757.1281292110203" y="153.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >VLA-FAIL / SAFECAST 无需失败数据</text><rect x="662.1281292110205" y="283.5" width="190" height="48" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="757.1281292110205" y="304.0" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >干预段</text><text x="757.1281292110205" y="318.0" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >接管者 · 前后 N 秒 · 恢复标记</text><rect x="385.0" y="366.0" width="190" height="48" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="480.0" y="386.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >段级策展 + 估值</text><text x="480.0" y="400.5" font-size="10" text-anchor="middle" font-weight="nor