<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="五件设备的共性规范：时钟同步总线、标定随数据走、隐私硬件三件套、设备注册、固件落盘即 MCAP 契约五层，及同步误差预算" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D6 共性规范：五层每件设备都要过</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >任何一件设备缺任一层，就不能进 record→export 验收。</text><rect x="20" y="70" width="240" height="58" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="140" y="104" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >① 时钟与同步总线</text><rect x="270" y="70" width="400" height="58" rx="6" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="280" y="87" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >单调 ns 时钟 + 启动时记录 UTC 偏移；有线场景 PTP</text><text x="280" y="102" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >头戴/手持用 3.3 V 触发脉冲 + 同步 LED（/event/sync）</text><text x="280" y="117" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >配对采集以 D2 或工控机为主时钟</text><rect x="20" y="136" width="240" height="58" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="140" y="170" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >② 标定随数据走</text><rect x="270" y="136" width="400" height="58" rx="6" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="280" y="153" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >出厂 Kalibr 内外参 + 时间偏移写入 /meta/calibration</text><text x="280" y="168" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >calibration_ref 哈希进 EpisodeMeta</text><text x="280" y="183" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >在线漂移再估计 → flag:calib_stale（R-07）</text><rect x="20" y="202" width="240" height="58" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="140" y="236" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >③ 隐私硬件三件套</text><rect x="270" y="202" width="400" height="58" rx="6" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="280" y="219" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >硬连线录制 LED（软件不可关）· 遮挡/篡改即停录</text><text x="280" y="234" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >物理停录开关</text><text x="280" y="249" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >隐私模式 A/B 由设备档案决定，操作者不可改</text><rect x="20" y="268" width="240" height="58" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="140" y="302" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >④ 设备注册</text><rect x="270" y="268" width="400" height="58" rx="6" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="280" y="285" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >device_id 兼容一机一码</text><text x="280" y="300" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >firmware_version 签名 + OTA 灰度</text><text x="280" y="315" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >设备档案（型号 / 末端 profile / 传感器族）进 lineage</text><rect x="20" y="334" width="240" height="58" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" opacity="1"></rect><text x="140" y="368" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >⑤ 固件落盘即 MCAP 契约</text><rect x="270" y="334" width="400" height="58" rx="6" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="280" y="351" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >/meta/health 1 Hz；关键帧间隔 ≤1 s</text><text x="280" y="366" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >chunk 4 MB / 1 s flush；断电恢复（recorder §4）</text><text x="280" y="381" font-size="9.5" text-anchor="start" font-weight="normal" fill="currentColor" >不经任何中间格式</text><text x="700" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >同步误差预算（architecture §8.4）</text><rect x="700" y="66" width="280" height="26" rx="3" fill="rgba(128,136,144,0.06)" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="83" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >多相机之间</text><text x="880" y="83" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤1 ms</text><text x="890" y="83" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >硬触发</text><rect x="700" y="96" width="280" height="26" rx="3" fill="none" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="113" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >IMU ↔ 视觉</text><text x="880" y="113" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤2 ms</text><text x="890" y="113" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >D1/D2 硬件</text><rect x="700" y="126" width="280" height="26" rx="3" fill="rgba(128,136,144,0.06)" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="143" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >触觉 ↔ 动作</text><text x="880" y="143" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤2 ms</text><text x="890" y="143" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >D1 同板</text><rect x="700" y="156" width="280" height="26" rx="3" fill="none" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="173" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >视觉 ↔ 动作 robot/device</text><text x="880" y="173" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤5 ms</text><text x="890" y="173" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >PTP / 触发</text><rect x="700" y="186" width="280" height="26" rx="3" fill="rgba(128,136,144,0.06)" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="203" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >视觉 ↔ 位姿 human 手机</text><text x="880" y="203" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤15 ms</text><text x="890" y="203" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >软同步</text><rect x="700" y="216" width="280" height="26" rx="3" fill="none" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="233" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >接管打点</text><text x="880" y="233" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤10 ms</text><text x="890" y="233" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >站内写入</text><rect x="700" y="246" width="280" height="26" rx="3" fill="rgba(128,136,144,0.06)" stroke="none" stroke-width="1" opacity="1"></rect><text x="708" y="263" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor" >手套 ↔ 动作</text><text x="880" y="263" font-size="10.5" text-anchor="end" font-weight="bold" fill="currentColor" >≤5 ms</text><text x="890" y="263" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >PTP</text><text x="20" y="432" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >适用性</text><text x="290" y="432" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >D1 UMI</text><text x="370" y="432" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >D2 头戴</text><text x="450" y="432" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >D3 手机</text><text x="530" y="432" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >D4 遥操站</text><text x="610" y="432" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >D5 车队</text><text x="20" y="456" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >①</text><text x="40" y="456" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >时钟与同步总线</text><text x="290" y="456" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >硬触发</text><text x="370" y="456" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >硬触发</text><text x="450" y="456" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >软同步</text><text x="530" y="456" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >PTP</text><text x="610" y="456" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >PTP</text><text x="20" y="474" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >②</text><text x="40" y="474" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >标定随数据走</text><text x="290" y="474" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >Kalibr</text><text x="370" y="474" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >Kalibr</text><text x="450" y="474" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >GeoCalib</text><text x="530" y="474" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >本体标定</text><text x="610" y="474" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >本体标定</text><text x="20" y="492" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >③</text><text x="40" y="492" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >隐私硬件三件套</text><text x="290" y="492" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >LED+开关</text><text x="370" y="492" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >三件套</text><text x="450" y="492" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >屏幕指示</text><text x="530" y="492" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >场地告示</text><text x="610" y="492" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >LED+远程在场</text><text x="20" y="510" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >④</text><text x="40" y="510" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >设备注册</text><text x="290" y="510" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="370" y="510" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="450" y="510" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >App 档案</text><text x="530" y="510" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="610" y="510" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >一机一码</text><text x="20" y="528" font-size="10" text-anchor="start" font-weight="bold" fill="currentColor" >⑤</text><text x="40" y="528" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >固件落盘即 MCAP 契约</text><text x="290" y="528" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="370" y="528" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="450" y="528" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >App 沙箱→契约</text><text x="530" y="528" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text><text x="610" y="528" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >✓</text></svg>