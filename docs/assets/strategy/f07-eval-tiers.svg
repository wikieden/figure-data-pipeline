<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385" role="img" aria-label="评测三层代理：真机是真值但每 ±2 点需约 1,030 次试验；仿真孪生用约 10 条真机演示校准；世界模型代理相关性可达 0.99 但只在专家动作分布内有效" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="80" y="40" width="780" height="84" rx="6" fill="rgba(42,120,214,0.12)" stroke="#2a78d6" stroke-width="2" /><text x="470.0" y="70.85" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >真机（真值）</text><text x="470.0" y="85.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >±2 点置信区间 ≈ 1,030 次试验（RoboLab，官方）· 真机农场 10→20 臂（U-31）</text><text x="470.0" y="100.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >序贯检验最多省 70%、主动因子设计省 20–40%（论文）</text><rect x="140" y="150" width="660" height="84" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="470.0" y="180.85" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >仿真孪生（SimFoundry / RoboSnap 路线）</text><text x="470.0" y="195.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >real2sim Pearson 0.911（论文，自家场景）· 准入 ≥0.8（U-20）</text><text x="470.0" y="210.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >每任务 ~10 条真机演示校准：排序 Spearman 0.70→0.875，更多反而变差（论文）</text><rect x="200" y="260" width="540" height="84" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="470.0" y="290.85" font-size="11" text-anchor="middle" font-weight="bold" fill="currentColor" >世界模型代理（RoboWorld / SC3 / R2S 路线）</text><text x="470.0" y="305.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >真机相关 r=0.989 / 0.929 / 0.823（论文）· 100 H100·h 复现整榜</text><text x="470.0" y="320.85" font-size="11" text-anchor="middle" font-weight="normal" fill="currentColor" >只在专家动作分布内有效（WorldSimProbe/WorldEcho）· 契约测试后才可用</text><line x1="470" y1="150" x2="470" y2="124" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="600.0" y="135.0" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" >校准演示 ≤10 条/任务，每季度重估</text><line x1="470" y1="260" x2="470" y2="234" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="600.0" y="245.0" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" >孪生场景 + 失败/扰动片段</text><path d="M 200 302 C 40 300, 40 90, 80 82" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="36" y="195" font-size="11" text-anchor="middle" font-weight="normal" fill="#eb6834" transform="rotate(-90 36 195)">代理相关性 &lt;0.8 连续两季度 → 回退真机（G4）</text><text x="20" y="370" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：越往下越便宜、越不可信；预算分配只信真机与校准过的孪生，世界模型代理用于排序而非验收。</text></svg>