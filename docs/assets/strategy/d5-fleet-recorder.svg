<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="1080" height="370" role="img" aria-label="D5 车队回流录制器的数据流：本体传感器与 OOD 探针分数进入环形缓冲，接管或 OOD 触发时固化前后窗口，按部署场景脱敏或加密后优先上传干预与失败片段" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D5 车队回流录制器（部署机器人上的采集终端）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >服务：fleet 来源 robot 轨 · 干预段（控制点 2）· 干预率 KPI · 一机一码 | 里程碑：M3 回流接口 → H2 车队 | BOM：机器人自带算力 + 512 GB 存储</text><text x="20" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >传感器（原生频率）</text><rect x="20" y="70" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="70" width="5" height="32" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="83" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >本体相机（头/腕/掌）</text><text x="32" y="97" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >30 Hz</text><line x1="240" y1="86" x2="270" y2="86" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="110" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="110" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="123" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >关节位置/速度/效应</text><text x="32" y="137" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >200 Hz</text><line x1="240" y1="126" x2="270" y2="126" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="150" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="150" width="5" height="32" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="163" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >触觉/力矩（若有）</text><text x="32" y="177" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >20–100 Hz</text><line x1="240" y1="166" x2="270" y2="166" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="190" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="190" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="203" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >OOD 探针分数（隐状态）</text><text x="32" y="217" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >10 Hz</text><line x1="240" y1="206" x2="270" y2="206" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="230" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="230" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="243" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >接管信号（本地/远程/共享）</text><text x="32" y="257" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >≤10 ms</text><line x1="240" y1="246" x2="270" y2="246" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="270" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="270" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="283" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >禁入区/远程在场事件</text><text x="32" y="297" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >事件</text><line x1="240" y1="286" x2="270" y2="286" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="270" y="70" width="170" height="232" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="355.0" y="168.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >同步 / 时钟</text><text x="355.0" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >机器人 PTP 主时钟</text><text x="355.0" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >policy_version · deployment_id</text><text x="355.0" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >一机一码 device_id + firmware</text><line x1="440" y1="186.0" x2="470" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="470" y="70" width="225" height="232" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="1.5" /><text x="582.5" y="154.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >机上处理</text><text x="582.5" y="168.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >环形缓冲（最近 5 min 高码率）</text><text x="582.5" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >OOD/接管触发固化 [−30 s, +60 s] 窗口</text><text x="582.5" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >家庭部署：机上脱敏（方案 A）</text><text x="582.5" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >工业场地：raw 加密（方案 B，合同约定）</text><text x="582.5" y="224.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >成功 episode 抽样 20%</text><line x1="695" y1="186.0" x2="725" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><rect x="725" y="70" width="135" height="232" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="792.5" y="168.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >落盘 / 上传</text><text x="792.5" y="182.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >512 GB 本地</text><text x="792.5" y="196.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >回坞优先上传干预/OOD/失败</text><text x="792.5" y="210.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >带宽受限时降码率</text><line x1="860" y1="186.0" x2="885" y2="186.0" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="888" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >契约 topics</text><text x="888" y="84" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/video/head|wrist_*</text><text x="888" y="100" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/joint_*</text><text x="888" y="116" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/ood_score</text><text x="888" y="132" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/event/intervention（tier/by）</text><text x="888" y="148" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/event/presence_disclosure</text><text x="888" y="164" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/deployment（site/zones）</text><text x="888" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/health</text><text x="888" y="196" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/meta/episode（source=fleet）</text><text x="20" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：它不是新硬件而是固件级规范；单位价值最高的数据（干预段）只在这里产生，触发式固化比全量高码率上传便宜一个量级。</text></svg>