idth="225" height="118" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="110" y="472.0" width="6" height="118.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="124" y="494" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >T_eff 对示范者归一化吞吐</text><text x="124" y="516" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >BMW：84 s 周期 / &gt;99% / 零干预</text><text x="124" y="538" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >车队 FMS + OTA + fallback ladders</text><text x="124" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >学习式视觉自标定跨机迁移</text><rect x="343" y="472" width="225" height="118" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="343" y="472.0" width="6" height="118.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="357" y="494" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >部署即评测：每条 episode 按客户 SOP 打分</text><text x="357" y="516" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >SOP 阶梯自动标注 + 失败模式本体</text><text x="357" y="538" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >鼎泰丰全门店；新站 3 天达 ROI</text><text x="357" y="560" font-size="9.6" text-anchor="start" font-weight="normal" fill="currentColor" >95 条/h · 93% 达标（自报）</text><rect x="576" y="472" width="225" height="118" rx="6" fill="rgba(128,136,144,0.06)" stroke="rgba(128,136,144,0.9)" stroke-width="0.8" opacity="1"></rect><rect x="576" y="472.0" width="6" height="118.0" rx="0" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="590" y="494" font-size="9.6" text-anchor="start" font-weight="bold" fill="currentColor" >Solve = 性能 × 声明范围 × 适应成本</text><text x="590" y="516" font-size="9.6" text-anchor="s