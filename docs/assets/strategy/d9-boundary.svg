<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="设备边界：做的五件设备与明确不做的六类设备，以及每一类不做的理由和重开条件" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D9 边界：做什么、不做什么、什么条件下重开</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >判据：一件设备至少喂一个战略控制点，且不与冻结决策（U-24 不做 PVT、U-04 末端未定）冲突。</text><rect x="20" y="70" width="420" height="300" rx="8" fill="rgba(27,175,122,0.06)" stroke="#1baf7a" stroke-width="1.5" opacity="1"></rect><text x="40" y="94" font-size="12" text-anchor="start" font-weight="bold" fill="#1baf7a" >做（喂控制点）</text><rect x="40" y="112" width="380" height="40" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="52" y="129" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D1 触觉同构 UMI</text><text x="52" y="144" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >控制点 2 对齐集 · R-04 触觉探针</text><rect x="40" y="162" width="380" height="40" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="52" y="179" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D2 头戴参考套件</text><text x="52" y="194" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >控制点 2 配对集 · U-32/U-33 基准</text><rect x="40" y="212" width="380" height="40" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="52" y="229" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D3 Creator 手机套件</text><text x="52" y="244" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >控制点 3 同意图 · 预训练供给</text><rect x="40" y="262" width="380" height="40" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="52" y="279" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D4 遥操作站 + 手套</text><text x="52" y="294" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >控制点 1 校准演示 · 控制点 2 干预段</text><rect x="40" y="312" width="380" height="40" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><text x="52" y="329" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >D5 车队回流录制器</text><text x="52" y="344" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >控制点 1 真机复核 · 控制点 2 干预段</text><rect x="470" y="70" width="510" height="300" rx="8" fill="rgba(192,57,43,0.05)" stroke="#c0392b" stroke-width="1.5" opacity="1"></rect><text x="490" y="94" font-size="12" text-anchor="start" font-weight="bold" fill="#c0392b" >不做（现在）</text><text x="680" y="94" font-size="10" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >理由</text><text x="830" y="94" font-size="10" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >重开条件</text><rect x="490" y="112" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="132" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >P2 眼镜量产版（PVT 500）</text><text x="680" y="132" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >不喂控制点，供给可外购</text><text x="830" y="132" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >U-24 复议（自采 &lt; 外购 ×1.5）</text><rect x="490" y="153" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="173" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >TwinDEX 式外骨骼</text><text x="680" y="173" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >末端未定，重定向无靶</text><text x="830" y="173" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >U-04 裁决三指/五指后</text><rect x="490" y="194" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="214" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >RDT2 式基站定位</text><text x="680" y="214" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >D1 VIO 已够，加基站不加语料</text><text x="830" y="214" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >VIO 漂移超 §8 预算</text><rect x="490" y="235" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="255" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >UMI-3D LiDAR 版</text><text x="680" y="255" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >几何可由 D2 双目 + 场景扫描得</text><text x="830" y="255" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >任务需要毫米级深度</text><rect x="490" y="276" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="296" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >力反馈主从臂</text><text x="680" y="296" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >贵、慢、不产干预段</text><text x="830" y="296" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >接触密集任务对齐失败</text><rect x="490" y="317" width="470" height="32" rx="5" fill="rgba(128,136,144,0.06)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500" y="337" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >外包遥操作</text><text x="680" y="337" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >干预段外流，控制点 2 失守</text><text x="830" y="337" font-size="9" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >仅限非对齐层的预训练供给</text><text x="20" y="390" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：右列每一项都写了重开条件，所以「不做」是可撤销的裁决而不是永久否定；唯一例外是外包遥操作，它直接把控制点 2 交出去。</text></svg>