<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="Sunday Memo 传感器布局示意：手部相机吊舱与第二开口、轮式底盘、伸缩脊柱、头部未披露" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="26" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >图 S-3　Sunday Memo 传感器布局示意（正视，非比例）</text><text x="20" y="44" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >来源：no-robot-data（手与手套同几何同传感器布局）、act-2-preview（可升降、前倾）、技术页 + 博客图片（图片推断 ⚠️）；本体尺寸/轮式为第三方 ⚠️</text><rect x="190" y="430" width="140" height="40" rx="12" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><circle cx="215" cy="470" r="14" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2"/><circle cx="305" cy="470" r="14" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2"/><rect x="248" y="170" width="24" height="260" rx="6" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><path d="M290,180 L290,270" stroke="rgba(128,136,144,0.9)" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="296" y="230" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >伸缩</text><rect x="190" y="170" width="140" height="22" rx="8" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><circle cx="260" cy="135" r="26" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" stroke-dasharray="3,2"/><path d="M190,180 L150,260 L140,330" stroke="rgba(128,136,144,0.9)" stroke-width="12" fill="none" stroke-linecap="round" stroke-line