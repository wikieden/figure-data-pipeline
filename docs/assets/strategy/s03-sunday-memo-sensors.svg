width="5" stroke-linecap="round"/><rect x="396" y="320" width="14" height="16" rx="3" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><circle cx="403" cy="312" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="403" y="316" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >1</text><circle cx="403" cy="338" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="403" y="342" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><circle cx="380" cy="408" r="10" fill="rgba(255,255,255,0.0)" stroke="#1baf7a" stroke-width="2" stroke-dasharray="3,2"/><text x="380" y="412" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1baf7a" >3</text><circle cx="260" cy="135" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="2,2"/><text x="260" y="139" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >?</text><circle cx="300" cy="410" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="300" y="414" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >5</text><circle cx="220" cy="450" r="10" fill="rgba(255,255,255,0.0)" stroke="#eda100" stroke-width="2" stroke-dasharray="3,2"/><text x="220" y="454" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#eda100" >6</text><text x="520" y="70" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" >标记说明（编号对应图中位置）</text><circle cx="530" cy="86" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >1</text><text x="548" y="90" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >手部相机吊舱 ×2</text><text x="548" y="104" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >每只手腕侧短支臂吊舱内一枚镜头，指向抓取区；与手套同位</text><text x="548" y="117" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >no-robot-data：一手（同几何同传感器布局）；位置来自图片 ⚠️</text><circle cx="530" cy="130" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="134" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><text x="548" y="134" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >吊舱第二开口 ×2</text><text x="548" y="148" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >同吊舱内长条形开口，类型未知（深度/红外?）</text><text x="548" y="161" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >技术页特写 ⚠️</text><circle cx="530" cy="174" r="10" fill="rgba(255,255,255,0.0)" stroke="#1baf7a" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="178" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1baf7a" >3</text><text x="548" y="178" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >力敏感</text><text x="548" y="192" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >「force sensitivity」使单手持两只酒杯不碎；是否有力/触觉传感器未写</text><text x="548" y="205" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >no-robot-data：一手（能力），传感器 ⚠️</text><circle cx="530" cy="218" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="1.5" stroke-dasharray="2,2"/><text x="530" y="222" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >?</text><text x="548" y="222" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >头部传感</text><text x="548" y="236" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >头部/场景相机未披露；采集端用相机帽，机器人端未说</text><text x="548" y="249" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >未披露</text><circle cx="530" cy="262" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="266" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >5</text><text x="548" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >本体感知</text><text x="548" y="280" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >全身；可升降、前倾、重新定位（whole-body）</text><text x="548" y="293" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >act-2-preview：一手；传感器类型未写</text><circle cx="530" cy="306" r="10" fill="rgba(255,255,255,0.0)" stroke="#eda100" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="310" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#eda100" >6</text><text x="548" y="310" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >底盘与脊柱</text><text x="548" y="324" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >轮式底盘 + 伸缩脊柱（地面至约 2.1 m）、约 77 kg</text><text x="548" y="337" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >humanoid.guide 第三方 ⚠️；act-2「adjust its height」一手</text><text x="520" y="360" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >末端：两片宽平软垫（拇指侧 / 对掌侧）加圆弧挡边；第三方称「三指」，图片未能确认 ⚠️。</text><text x="520" y="378" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >未披露：传感器套件全部规格、相机数量、触觉、麦克风、成本。</text><text x="20" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >颜色 = 传感器类别：</text><rect x="140" y="576" width="10" height="10" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="154" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >视觉</text><rect x="202" y="576" width="10" height="10" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="216" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >触觉/力</text><rect x="264" y="576" width="10" height="10" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="278" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >本体感知</text><rect x="326" y="576" width="10" height="10" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="340" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >音频</text><rect x="388" y="576" width="10" height="10" rx="2" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><text x="402" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >供电/通信</text><text x="20" y="601" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >标记样式：实心 = 一手文字写明位置；虚线 = 一手提及该传感器但位置未写明/来自图片推断 ⚠️；? = 未披露。</text></svg>