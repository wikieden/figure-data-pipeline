<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-label="Generalist 机器人端传感器布局示意：无自有本体，腕装相机与手持采集设备同位" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="26" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >图 S-4　Generalist 机器人端（无自有本体）传感器布局示意：与 Data Hands 同位安装的 UMI 参考构型（非比例）</text><text x="20" y="44" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >来源：gen-1.5（robot&#x27;s cameras、handheld grippers）、thousand-hands（末端各有自己的相机位置）一手；UMI 构型为 umi-gripper.github.io（论文）；Generalist 机器人端实物未见一手图 ⚠️</text><rect x="90" y="440" width="60" height="30" rx="6" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><path d="M120,440 L180,300 L300,240 L420,290" stroke="rgba(128,136,144,0.9)" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><circle cx="120" cy="440" r="4" fill="#9aa3ad" stroke="none" stroke-width="1.2"/><circle cx="180" cy="300" r="4" fill="#9aa3ad" stroke="none" stroke-width="1.2"/><circle cx="300" cy="240" r="4" fill="#9aa3ad" stroke="none" stroke-width="1.2"/><circle cx="420" cy="290" r="4" fill="#9aa3ad" stroke="none" stroke-width="1.2"/><rect x="402" y="290" width="36" height="40" rx="5" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><path d="M406,330 L408,385 M434,330 L432,385" stroke="rgba(128,136,144,0.9)" stroke-width="5" stroke-linecap="round"/><rect x="408" y="268" width="24" height="18" rx="4" fill="rgba(128,136,144,0.14)" stroke="rgba(128,136,144,0.9)" stroke-width="1.2" opacity="1"></rect><circle cx="420" cy="260" r="10" fill="#2a78d6" stroke="white" stroke-width="1.5"/><text x="420" y="264" font-size="10.5" text-anchor="middle" font-weight="bold" fill="white" >1</text><circle cx="390" cy="310" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="390" y="314" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><circle cx="450" cy="310" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="450" y="314" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><circle cx="420" cy="394" r="10" fill="rgba(255,255,255,0.0)" stroke="#1baf7a" stroke-width="2" stroke-dasharray="3,2"/><text x="420" y="398" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1baf7a" >3</text><circle cx="460" cy="282" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="460" y="286" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >4</text><circle cx="180" cy="270" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="180" y="274" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >5</text><text x="180" y="490" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >臂：UR / Flexiv / 6–16+ DoF 半人形（一手）；末端约 9,000 种变体，相机位置随末端变化</text><text x="520" y="70" font-size="12.5" text-anchor="start" font-weight="bold" fill="currentColor" >标记说明（编号对应图中位置）</text><circle cx="530" cy="86" r="10" fill="#2a78d6" stroke="white" stroke-width="1.5"/><text x="530" y="90" font-size="10.5" text-anchor="middle" font-weight="bold" fill="white" >1</text><text x="548" y="90" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >腕装相机</text><text x="548" y="104" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >夹爪上方，与手持 Data Hands 同位；人类演示可「in view of the robot&#x27;s cameras」</text><text x="548" y="117" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >gen-1.5：一手（robot&#x27;s cameras）；同位安装为 UMI 原则</text><circle cx="530" cy="130" r="10" fill="rgba(255,255,255,0.0)" stroke="#2a78d6" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="134" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#2a78d6" >2</text><text x="548" y="134" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >侧镜 / 指尖标记（UMI 原型）</text><text x="548" y="148" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >鱼眼画幅内两侧反射镜 + 指尖 fiducial</text><text x="548" y="161" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >UMI 论文；Data Hands 是否保留未披露 ⚠️</text><circle cx="530" cy="174" r="10" fill="rgba(255,255,255,0.0)" stroke="#1baf7a" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="178" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#1baf7a" >3</text><text x="548" y="178" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >夹爪开合 / 力</text><text x="548" y="192" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >开合度为动作真值；工具类末端（钳、削皮器）涉及力与柔顺，传感器未写</text><text x="548" y="205" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >thousand-hands：一手（能力），传感器 ⚠️</text><circle cx="530" cy="218" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="222" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >4</text><text x="548" y="222" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >IMU（UMI 原型）</text><text x="548" y="236" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >相机侧；VIO 位姿恢复</text><text x="548" y="249" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >UMI 论文；Data Hands 未披露 ⚠️</text><circle cx="530" cy="262" r="10" fill="rgba(255,255,255,0.0)" stroke="#9aa3ad" stroke-width="2" stroke-dasharray="3,2"/><text x="530" y="266" font-size="10.5" text-anchor="middle" font-weight="bold" fill="#9aa3ad" >5</text><text x="548" y="266" font-size="11" text-anchor="start" font-weight="bold" fill="currentColor" >本体感知</text><text x="548" y="280" font-size="10" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >各关节；GEN-1.5 输入含 proprioceptive inputs</text><text x="548" y="293" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >gen-1.5：一手</text><text x="520" y="320" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >Generalist 不造本体，「机器人端」= 合作臂 + 自家末端 + 相机；</text><text x="520" y="338" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >头部/场景相机是否存在未披露。Skild 同样无本体（omni-bodied），</text><text x="520" y="356" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >one-policy 页只写「online vision and proprioception」，不单独作图。</text><text x="20" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >颜色 = 传感器类别：</text><rect x="140" y="576" width="10" height="10" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="154" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >视觉</text><rect x="202" y="576" width="10" height="10" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="216" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >触觉/力</text><rect x="264" y="576" width="10" height="10" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="278" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >本体感知</text><rect x="326" y="576" width="10" height="10" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="340" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >音频</text><rect x="388" y="576" width="10" height="10" rx="2" fill="#eda100" stroke="none" stroke-width="1" opacity="1"></rect><text x="402" y="585" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >供电/通信</text><text x="20" y="601" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >标记样式：实心 = 一手文字写明位置；虚线 = 一手提及该传感器但位置未写明/来自图片推断 ⚠️；? = 未披露。</text></svg>