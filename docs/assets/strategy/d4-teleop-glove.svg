e">/meta/operator</text><text x="888" y="180" font-size="9" text-anchor="start" font-weight="normal" fill="currentColor" font-family="IBM Plex Mono,Menlo,monospace">/signal/haptic_feedback?</text><text x="20" y="354" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：手套采样 ≥200 Hz 来自 T-800 的证据（人手动作含 &gt;100 Hz 能量）；速度带节拍器是 R-14 的采集端对策；干预段边界是 DAgger 与 RECAP 后训练的素材。</text></svg>