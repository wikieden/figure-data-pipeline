<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="1080" height="370" role="img" aria-label="D4 遥操作站的数据流：Quest 手腕位姿、≥200 Hz 数据手套、接管键与机器人回传经 PTP 主时钟对齐，站内完成重定向、即时质控与接管打点后落盘 robot 轨 MCAP" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D4 遥操作站 + 数据手套（robot 轨对齐与干预段）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >服务：robot 轨对齐集 · 干预段 · DAgger · 控制点 2 | 里程碑：H0 1 站 → H1 3–5 站 | BOM：Quest 3 $500 + 手套 $3–6k/对（低成本 IMU 手套 $300–800 备选）+ 工控机</text><text x="20" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >传感器（原生频率）</text><rect x="20" y="70" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="70" width="5" height="32" rx="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="83" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >Quest 3 / OpenXR 手腕位姿</text><text x="32" y="97" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >60–90 Hz</text><line x1="240" y1="86" x2="270" y2="86" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="110" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="110" width="5" height="32" rx="2" fill="#1baf7a" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="123" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >数据手套逐指关节 ×2</text><text x="32" y="137" font-si