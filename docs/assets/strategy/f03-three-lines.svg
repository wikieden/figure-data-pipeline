<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="三条主线的机制：供给层外购小时进入对齐层，对齐层产出配方与新任务，闭环层用分级得分与干预率反向分配预算" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="140" y="40" width="660" height="70" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="2" /><text x="470.0" y="71.2" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >C 闭环层（自研）</text><text x="470.0" y="87.2" font-size="12" text-anchor="middle" font-weight="normal" fill="currentColor" >评测孪生 · 世界模型代理 · 真机农场 · 序贯统计 · 车队回流 · 自改进</text><rect x="140" y="165" width="660" height="70" rx="6" fill="rgba(42,120,214,0.10)" stroke="#2a78d6" stroke-width="2" /><text x="470.0" y="196.2" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >A 对齐层护城河（自研）</text><text x="470.0" y="212.2" font-size="12" text-anchor="middle" font-weight="normal" fill="currentColor" >单一动作 schema · 人→机伪标签 · 段级策展与估值 · 元数据条件化配方 · lineage</text><rect x="140" y="290" width="660" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="470.0" y="321.2" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >B 供给层杠杆（外购为主，自建接口）</text><text x="470.0" y="337.2" font-size="12" text-anchor="middle" font-weight="normal" fill="currentColor" >Creator App 众包 · 外部训练场/供应商 · 开源大集 · 自采只做对齐与校准所需的量</text><line x1="470" y1="290" x2="470" y2="235" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="480.0" y="266.5" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" >外购/众包小时 → 入湖（契约 + 同意图）</text><line x1="470" y1="165" x2="470" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/><text x="480.0" y="141.5" font-size="11" text-anchor="start" font-weight="normal" fill="currentColor" >配方 · 对齐集 · 新任务 checkpoint</text><path d="M 140 110 C 70 140, 70 260, 140 300" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="72" y="205" font-size="11" text-anchor="middle" font-weight="normal" fill="#eb6834" transform="rotate(-90 72 205)">预算反向分配（因子偏差 → 任务库配额）</text><path d="M 800 100 C 860 120, 860 160, 800 180" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="870" y="128" font-size="11" text-anchor="start" font-weight="normal" fill="#eb6834" >分级得分 · 干预率</text><text x="870" y="143" font-size="11" text-anchor="start" font-weight="normal" fill="#eb6834" >干预段</text><text x="870" y="158" font-size="11" text-anchor="start" font-weight="normal" fill="#eb6834" >→ 估值 · DAgger</text><text x="470" y="24" font-size="11" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >部署车队在闭环层产生干预段（单位价值最高的数据），沿右侧回路进入对齐层</text><text x="20" y="385" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：A 是唯一不可外购的层；B 只建接口不建产能；C 决定 A 与 B 的预算怎么分。</text></svg>