 text-anchor="start" font-weight="normal" fill="currentColor">4. 新 checkpoint 先在 T1 复核，不直接继承上一版的档位</text><rect x="562" y="522" width="528" height="136" rx="6" fill="rgba(237,161,0,0.10)" stroke="currentColor" stroke-width="1"/><rect x="562" y="522" width="6" height="136" rx="2" fill="#eda100"/><text x="580" y="544" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor">降档与临时接管</text><text x="580" y="570" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">临时接管（不降档）：OOD 二级 → 请求人工接管；三级 → estop</text><text x="580" y="592" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">降一档：接管率周环比 &gt;30% 或任务簇成功率跌破阈值</text><text x="580" y="614" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">降档同时开 Stage D 后训练 run，并写一条 ⑨ loop 记录</text><text x="580" y="636" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">新任务 / 新站点 / 新本体：一律从 T0 起</text><text x="20" y="688" font-size="12" text-anchor="start" font-weight="bold" fill="currentColor">约束（贯穿全部档位）</text><rect x="20" y="696" width="258" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1"/><text x="34" y="717" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor">对外口径</text><text x="34" y="737" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">干预率是内部 KPI，不对外宣称</text><text x="34" y="753" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">对外宣称附可复现日志（R-03）</text><rect x="290" y="696" width="258" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1"/><text x="304" y="717" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor">安全</text><text x="304" y="737" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">ISO 10218 / TS 15066 / 13482 基线</text><text x="304" y="753" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">安全过滤器 · 心跳丢失 200 ms 停机</text><rect x="561" y="696" width="258" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1"/><text x="575" y="717" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor">隐私</text><text x="575" y="737" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">家庭部署机上脱敏 · 禁入区</text><text x="575" y="753" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">远程接管在场披露</text><rect x="832" y="696" width="258" height="70" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1"/><text x="846" y="717" font-size="11.5" text-anchor="start" font-weight="bold" fill="currentColor">lineage</text><text x="846" y="737" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">policy_version · deployment_id</text><text x="846" y="753" font-size="10" text-anchor="start" font-weight="normal" fill="currentColor">每次定档写决策记录</text><rect x="20" y="790" width="10" height="10" rx="2" fill="#2a78d6"/><text x="35" y="799" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">robot 轨</text><rect x="100" y="790" width="10" height="10" rx="2" fill="#eda100"/><text x="115" y="799" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">新增（提议）</text><rect x="210" y="787" width="22" height="15" rx="7.5" fill="none" stroke="currentColor" stroke-width="0.8"/><text x="221.0" y="798" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor">M3</text><text x="242" y="799" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor">里程碑（M1 采集与格式 · M3 训练与闭环）</text><text x="20" y="822" font-size="10.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)">详见 data-pipeline-design.md §9.4。三档划分沿用 1X 三档自主（官方）；档线、N 与门槛为提议，待 governance U-52 裁决。</text></svg>
