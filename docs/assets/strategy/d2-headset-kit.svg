<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="1080" height="370" role="img" aria-label="D2 头戴参考套件的数据流：主 RGB、双目 SLAM 相机、双 IMU 与麦克风经硬触发同步，机上双码率编码、预检与脱敏/加密两种模式后落盘环形缓冲" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D2 受控场地头戴参考套件（EVT/DVT，不量产）</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >服务：human 轨自采（方案 B）· U-32 脱敏对照 · U-33 ego+exo · 与 D1 同戴校准伪标签 | 里程碑：H1 EVT 10–50 台 → DVT 参考设计开源，不做 PVT | BOM $150–300（EVT 含 NRE ≈$600）</text><text x="20" y="62" font-size="11" text-anchor="start" font-weight="bold" fill="rgba(128,136,144,0.9)" >传感器（原生频率）</text><rect x="20" y="70" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="70" width="5" height="32" rx="2" fill="#eb6834" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="83" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >主 RGB 相机 ≥120° 俯角 15–25°</text><text x="32" y="97" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >1440p@60</text><line x1="240" y1="86" x2="270" y2="86" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><rect x="20" y="110" width="220" height="32" rx="5" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" opacity="1"></rect><rect x="20" y="110" width="5" height="32" rx="2" fill="#9aa3ad" stroke="none" stroke-width="1" opacity="1"></rect><text x="32" y="123" font-size="10.5" text-anchor="start" font-weight="normal" fill="currentColor" >双目全局快门灰度（SLAM+立体）</text><text x="32" y="137" font-