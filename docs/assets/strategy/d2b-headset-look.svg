="569" cy="505" r="9" fill="#2a78d6"/><text x="569" y="508.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >3</text><text x="586" y="503" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >IMU ×2</text><text x="586" y="516" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >200 Hz，与相机硬触发对齐</text><circle cx="569" cy="535" r="9" fill="#2a78d6"/><text x="569" y="538.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >4</text><text x="586" y="533" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >麦克风阵列 ×4</text><text x="586" y="546" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >16 kHz，只录口令段</text><circle cx="829" cy="445" r="9" fill="#2a78d6"/><text x="829" y="448.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >5</text><text x="846" y="443" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >录制 LED</text><text x="846" y="456" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >硬连线，前向可见</text><circle cx="829" cy="475" r="9" fill="#2a78d6"/><text x="829" y="478.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >6</text><text x="846" y="473" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >后舱</text><text x="846" y="486" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >电池/SoC/存储/停录开关</text><circle cx="829" cy="505" r="9" fill="#2a78d6"/><text x="829" y="508.5" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff" >7</text><text x="846" y="503" font-size="10.5" text-anchor="start" font-weight="bold" fill="currentColor" >同步脉冲输出</text><text x="846" y="516" font-size="9.5" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >3.5 mm，驱动 exo 相机与 D1</text><circle cx="829" cy="535" r="9" fill="#2a78d6"/><text x="829" y