ll="currentColor" >⑥ 脱敏前 vs 后（方案 B 场地）</text><text x="500" y="91.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >手部可见率 · MPJPE 差</text><text x="500" y="104.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >→ U-32 脱敏损伤基准</text><rect x="541.0" y="57.5" width="44" height="14" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="563.0" y="68.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff" >H0 末</text><text x="20" y="484" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：D2 出现在四组配对里，因为它输出同步脉冲、是配对的时钟源；③⑥ 是「一件设备两种状态」的配对，不需要第二件硬件。</text></svg>