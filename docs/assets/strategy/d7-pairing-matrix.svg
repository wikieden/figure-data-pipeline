<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="配对采集矩阵：六组配对，每组连接两件设备或一件设备的两种状态，标注产出、用途与里程碑；这是控制点 2 对齐层语料的生产方式" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><text x="20" y="24" font-size="14" text-anchor="start" font-weight="bold" fill="currentColor" >D7 配对采集矩阵：控制点 2 的生产方式</text><text x="20" y="44" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >同一操作者、同一任务、同一时钟下同时记录两路，差值本身就是数据资产（伪标签刻度、迁移对、脱敏损伤基准）。</text><line x1="442.53731343283584" y1="172.0" x2="395.5223880597015" y2="190.0" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="235.0" y1="197.97142857142856" x2="237.0" y2="198.3942857142857" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="500.0" y1="172.0" x2="500.0" y2="238.0" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="500.0" y1="308.0" x2="500.0" y2="292.0" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="150" y1="202" x2="150" y2="252" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="235.0" y1="351.85714285714283" x2="412.0" y2="397.37142857142857" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="765.0" y1="351.85714285714283" x2="588.0" y2="397.37142857142857" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="765.0" y1="197.97142857142856" x2="763.0" y2="198.3942857142857" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="557.4626865671642" y1="172.0" x2="604.4776119402985" y2="190.0" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><line x1="500" y1="128" x2="500" y2="92" stroke="rgba(128,136,144,0.7)" stroke-width="1.5"/><rect x="65" y="158" width="170" height="44" rx="6" fill="rgba(128,136,144,0.10)" stroke