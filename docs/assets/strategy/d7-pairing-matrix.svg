x="2" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><rect x="240.0" y="190.5" width="170" height="53" rx="4" fill="rgba(128,136,144,0.12)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="325.0" y="203.5" font-size="9.5" text-anchor="middle" font-weight="bold" fill="currentColor" >① 同时佩戴</text><text x="325.0" y="216.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >视觉伪标签 vs 硬件真值</text><text x="325.0" y="229.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >→ 伪标签质量分刻度 · L4 消融</text><rect x="366.0" y="182.5" width="44" height="14" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="388.0" y="193.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff" >H0 起</text><rect x="415.0" y="238.5" width="170" height="53" rx="4" fill="rgba(128,136,144,0.12)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="500.0" y="251.5" font-size="9.5" text-anchor="middle" font-weight="bold" fill="currentColor" >② ego + exo 同步对</text><text x="500.0" y="264.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >上身对齐动作块</text><text x="500.0" y="277.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >→ U-33 100 h 探针</text><rect x="541.0" y="230.5" width="44" height="14" rx="3" fill="#2a78d6" stroke="none" stroke-width="1" opacity="1"></rect><text x="563.0" y="241.5" font-size="9" text-anchor="middle" font-weight="bold" fill="#fff" >H1</text><rect x="65.0" y="225.5" width="170" height="53" rx="4" fill="rgba(128,136,144,0.12)" stroke="currentColor" stroke-width="0.8" opacity="1"></rect><text x="150" y="238.5" font-size="9.5" text-anchor="middle" font-weight="bold" fill="currentColor" >③ 阵列 + 光学触觉并排</text><text x="150" y="251.5" font-size="9.5" text-anchor="middle" font-weight="normal" fill="currentColor" >跨传感器配对帧</text><text x="150" y="264.5" font-size="9.5" text-anchor="middle" 