<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="一个内部数据引擎支撑五条对外产品线：PL3 策展即服务现金流最早，PL4 评测即服务是控制点，PL1/PL2 做供给接口与格式锁定" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif" style="max-width:100%;height:auto"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="180" y="30" width="600" height="64" rx="6" fill="rgba(128,136,144,0.10)" stroke="currentColor" stroke-width="1" /><text x="480.0" y="58.2" font-size="12" text-anchor="middle" font-weight="bold" fill="currentColor" >内部数据引擎平台（本仓库 + data-platform）</text><text x="480.0" y="74.2" font-size="12" text-anchor="middle" font-weight="normal" fill="currentColor" >采集 SDK/MCAP · 入湖/契约 · 段级策展 · 对齐/伪标签 · 评测 CI · lineage</text><line x1="240.0" y1="94" x2="100.0" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="12.0" y="170" width="176" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="100.0" y="202.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >PL1 Creator App / 众包</text><text x="100.0" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >供给接口 · $6/h 起按通过分钟付</text><text x="100.0" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >H1 试点 · H2 千人</text><line x1="360.0" y1="94" x2="290.0" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="202.0" y="170" width="176" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="290.0" y="202.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >PL2 采集套件</text><text x="290.0" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >UMI/头戴参考设计 + SDK · 格式锁定</text><text x="290.0" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >P1 EVT 后</text><line x1="480.0" y1="94" x2="480.0" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="392.0" y="170" width="176" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="480.0" y="202.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >PL3 策展即服务</text><text x="480.0" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >段级策展 + 八维报告 + lineage</text><text x="480.0" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >报告器 v0 2026-11-01 · M2 后签 2 家</text><text x="480.0" y="274" font-size="11" text-anchor="middle" font-weight="normal" fill="rgba(128,136,144,0.9)" >现金流最早，不是控制点</text><line x1="600.0" y1="94" x2="670.0" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="582.0" y="170" width="176" height="86" rx="6" fill="rgba(42,120,214,0.14)" stroke="#2a78d6" stroke-width="2.5" /><text x="670.0" y="202.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >PL4 评测即服务（Policy QA）</text><text x="670.0" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >孪生 + 代理 + 真机农场 + 序贯统计</text><text x="670.0" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >校准数据 H1 起内部积累 · M3 后对外</text><text x="670.0" y="274" font-size="11" text-anchor="middle" font-weight="bold" fill="#2a78d6" >战略控制点（校准数据）</text><line x1="720.0" y1="94" x2="860.0" y2="170" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/><rect x="772.0" y="170" width="176" height="86" rx="6" fill="rgba(128,136,144,0.08)" stroke="currentColor" stroke-width="1" /><text x="860.0" y="202.5" font-size="10" text-anchor="middle" font-weight="bold" fill="currentColor" >PL5 配方与适配</text><text x="860.0" y="216.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >few-shot 适配 · 条件化配方</text><text x="860.0" y="230.5" font-size="10" text-anchor="middle" font-weight="normal" fill="currentColor" >24 月</text><text x="20" y="330" font-size="11" text-anchor="start" font-weight="normal" fill="rgba(128,136,144,0.9)" >读法：先靠 PL3 收钱，但 PL4 的校准数据积累从 H1 起内部运行——对外可以晚，数据不能晚（§5.2 修正）。</text></svg>