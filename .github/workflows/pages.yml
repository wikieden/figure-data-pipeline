name: pages

# Publishes site/index.html (data system overview) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/strategy/p01-data-pipeline-flow.svg"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp docs/assets/strategy/p01-data-pipeline-flow.svg _site/assets/
          # The page references the diagram relative to the repo; rewrite for the published layout.
          sed -i 's#\.\./docs/assets/strategy/#assets/#g' _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
